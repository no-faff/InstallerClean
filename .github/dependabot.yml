version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/InstallerClean
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
    # The runtime packages (Microsoft.Extensions.DependencyInjection,
    # .Abstractions, System.Memory, System.Text.Json,
    # Microsoft.Bcl.TimeProvider, Microsoft.Bcl.HashCode) travel in the
    # binary closure, so a patch bump changes the shipped bytes, and every
    # new binary is a fresh VirusTotal result. They are held still between
    # releases so a patch-level change does not re-roll one; no flag in
    # this project's history has been traced to a dependency bump.
    # Security advisories still PR through because Dependabot's
    # security-update path overrides version-update:ignore.
    ignore:
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Memory
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.TimeProvider
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.HashCode
        update-types:
          - version-update:semver-patch

  - package-ecosystem: nuget
    directory: /src/InstallerClean.Core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Memory
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.TimeProvider
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.HashCode
        update-types:
          - version-update:semver-patch

  - package-ecosystem: nuget
    directory: /src/InstallerClean.Cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Memory
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.TimeProvider
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.HashCode
        update-types:
          - version-update:semver-patch

  - package-ecosystem: nuget
    directory: /src/InstallerClean.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Memory
        update-types:
          - version-update:semver-patch
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.TimeProvider
        update-types:
          - version-update:semver-patch
      - dependency-name: Microsoft.Bcl.HashCode
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # Version 3 of the SignPath action submits the signing request to a
    # different connector, and that connector requires a SignPath GitHub App
    # installed on the organisation. The major is held here so that one
    # dependency does not hold the rest of the group with it; minor and patch
    # bumps still come through. Remove the ignore below once the App is
    # installed.
    ignore:
      - dependency-name: SignPath/github-action-submit-signing-request
        update-types:
          - version-update:semver-major
