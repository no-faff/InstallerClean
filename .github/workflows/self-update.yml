# Updates the command line from a build of the pushed commit to the current
# release, on a Windows runner, the way a copy on somebody's machine updates
# itself.
#
# The command line is published from the commit with release.yml's flags and an
# older version number than the current release, then run with /s and its input
# and output redirected, which is how a scheduled task or a script runs it: it
# updates without asking, and the newer version runs the command as given. One leg
# runs it as the command line's own download, from a folder of its own; the other
# installs a setup built the same way and runs the copy the setup put in Program
# Files. Each leg has a runner to itself, so neither route's files, registry or
# Application-log entries can answer for the other's.
#
# What this covers is the half of an update the pushed code does: finding the
# newer version, downloading it into a staging folder and handing the run over to
# it there. The newer version, whichever release is current, then runs the command
# and puts itself at the running copy's path once both have ended, and the checks
# read what it left. A current release older than the first that can do that
# refuses the switches and runs nothing: the old copy runs the command itself, the
# checks read that, and the job says the update itself was not tested.
#
# The builds are single-file Release builds, as shipped, and have to stay so. A
# build from source loads its assemblies from loose files beside the exe, which a
# shipped build does not have, so this workflow would pass over loads the shipped
# build cannot make.
#
# Process Monitor records the update, and the files the old copy looks for to load and
# the images it loads are judged with the functions and the list in
# scripts/native-libraries.ps1, as the native-libraries job in ci.yml judges the
# command line's run that checks for updates: the same exe, built from the same code.
# Nothing of the newer version is judged, since it is the release, the setup it starts
# on the setup's copy included; the permissions of the folder that setup's setup.tmp
# runs from are printed as it made them. On the command line's own download the update is
# then made again from a copy of this build in a folder of its own, with the genuine
# file planted at every path the first update looked at for a file to load and the
# list does not name, hostfxr.dll and hostpolicy.dll aside, and the job fails where
# the old copy reads or loads one. A copy in Program Files, the setup's, is not
# planted for, since only an administrator can write a file there.
#
# It runs apart from ci.yml because it reaches GitHub for the release. A run that
# cannot reach GitHub fails here, with the command line's own output saying
# nothing was tried, and never reads as a pass.

name: Self-update

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. The one call that needs the token reads the current release.
permissions:
  contents: read

env:
  # Below the current release, so the build finds a newer version to update to.
  OLD_VERSION: '3.3.0'

jobs:
  update:
    name: Update ${{ matrix.route == 'setup' && 'the setup''s copy' || 'the command line''s own download' }}
    # The same image as ci.yml and release.yml.
    runs-on: windows-2025
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        route: [download, setup]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Read here through GitHub's API, apart from the app, which reads where
      # github.com's releases/latest page redirects to. The checks below compare
      # what the app installed against this.
      - name: Read the current release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "Could not read the current release." }
          $latest = $tag.Trim() -replace '^v', ''
          if (-not ($latest -as [version])) { throw "The current release's tag '$tag' is not a version." }
          if ([version]$latest -le [version]$env:OLD_VERSION) {
            throw "The current release, $latest, is not newer than $env:OLD_VERSION, so there is nothing to update to."
          }
          "  The current release is $latest; the build is numbered $env:OLD_VERSION."
          "LATEST=$latest" | Add-Content $env:GITHUB_ENV
          # The old copy runs the command with the newer version from its download folder,
          # passing it the switches that ask it to stand for this copy and take its place
          # afterwards. A release before the first to read them refuses them as arguments it
          # does not know and runs nothing, so against such a release the old copy runs the
          # command itself, and the checks read that instead of an update,
          # saying so here and in the summary. What the old copy looks for and loads is
          # judged either way.
          $first = '3.5.0'
          $v = [version]$latest
          if ([version]"$($v.Major).$($v.Minor).$([Math]::Max($v.Build, 0))" -lt [version]$first) {
            $said = "The update itself was not tested: the current release, $latest, is older than $first, the first release that can run a command standing for an older copy. The checks read that the old copy, $env:OLD_VERSION, ran the command itself, and judge what it looked for and loaded."
            "::warning::$said"
            "## Self-update: the update itself not tested`n`n$said" | Add-Content $env:GITHUB_STEP_SUMMARY
            "STAGED=false" | Add-Content $env:GITHUB_ENV
          } else {
            "STAGED=true" | Add-Content $env:GITHUB_ENV
          }

      - name: Publish the command line at the older version
        run: dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.OLD_VERSION }} --nologo -o publish/cli

      - name: Publish the portable GUI at the older version
        if: matrix.route == 'setup'
        run: dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.OLD_VERSION }} --nologo -o publish/self-contained

      - name: Install Inno Setup
        if: matrix.route == 'setup'
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Compile the setup at the older version
        if: matrix.route == 'setup'
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          & $iscc "/DAppVersion=$env:OLD_VERSION" installer\InstallerClean.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      # The setup's copy is recognised by the folder the setup records in its
      # uninstall key, so the path is read from there rather than assumed. A window
      # left running would hold the single-instance mutex, which the newer setup
      # stops for, so the step fails on one rather than letting the update fail
      # for a reason that is not the code.
      - name: Put the older version in place
        shell: pwsh
        run: |
          if ('${{ matrix.route }}' -eq 'setup') {
            $setup = (Resolve-Path "publish/InstallerClean-$env:OLD_VERSION-setup.exe").Path
            $log = Join-Path $env:RUNNER_TEMP 'setup-install.log'
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "The setup exited with code $($p.ExitCode)." }
            $key = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1' -ErrorAction Stop
            $folder = $key.InstallLocation.TrimEnd('\')
            if (Get-Process InstallerClean -ErrorAction SilentlyContinue) { throw "InstallerClean is running after the silent install." }
          } else {
            $folder = Join-Path $env:RUNNER_TEMP 'download'
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item publish/cli/installerclean-cli.exe $folder
          }
          $exe = Join-Path $folder 'installerclean-cli.exe'
          $files = @($exe)
          if ('${{ matrix.route }}' -eq 'setup') { $files += Join-Path $folder 'InstallerClean.exe' }
          foreach ($f in $files) {
            $v = (Get-Item $f).VersionInfo.FileVersion
            "  $f carries $v"
            if (-not $v.StartsWith("$env:OLD_VERSION.")) { throw "$f carries $v, not $env:OLD_VERSION." }
          }
          "EXE=$exe" | Add-Content $env:GITHUB_ENV

      # Process creation and exit are audited on the setup's copy, so the Security
      # log can show when the setup and every process it starts begin and end,
      # against when the command line reads what the setup left.
      - name: Audit process starts and exits
        if: matrix.route == 'setup'
        run: |
          auditpol /set /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /success:enable
          if ($LASTEXITCODE -ne 0) { throw "auditpol could not turn on Process Creation." }
          auditpol /set /subcategory:'{0CCE922C-69AE-11D9-BED3-505054503030}' /success:enable
          if ($LASTEXITCODE -ne 0) { throw "auditpol could not turn on Process Termination." }

      # native.ps1 names the build as the native-libraries job's command line that
      # checks for updates, so the list's entries for that run apply to the old copy.
      #
      # A failure of Process Monitor's own leaves the update and its checks to run, and
      # the judging step fails on the record that is missing.
      - name: Get Process Monitor and start recording
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'native.ps1') -Value @'
          $builds = @(
            [pscustomobject]@{ Label = 'command line, checking for updates'; Exe = 'publish/cli/installerclean-cli.exe'; Source = 'src/InstallerClean.Cli/LibrarySearch.cs'; MustLoad = @('winhttp.dll'); Marker = 'replace leftovers' }
          )
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          '@
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $procmon = Get-Procmon (Join-Path $env:RUNNER_TEMP 'procmon')
          "PROCMON=$procmon" | Add-Content $env:GITHUB_ENV
          Start-Record 'update'

      # Standard input and output both redirected, which is what makes the run
      # one nobody can answer. The newer version is started in the same console
      # and inherits the output, so it is read to the end of both. The function
      # is kept in a file for the second run the checks make.
      - name: Run the update
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'run.ps1'
          Set-Content -Path $helper -Value @'
          function Run([string]$exe, [int]$seconds = 0) {
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe, '/s')
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($info)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            if ($seconds -gt 0) {
              if (-not $p.WaitForExit($seconds * 1000)) {
                $p.Kill($true)
                throw "$exe was still running after $seconds s and was ended."
              }
            }
            $p.WaitForExit()
            [pscustomobject]@{ ExitCode = $p.ExitCode; Output = $out.Result + $err.Result; Id = $p.Id }
          }
          '@
          . $helper
          # On the setup's copy a job writes down each is-*.tmp folder that appears in a
          # temp folder (Get-TempFolders) while the update runs, with its owner and its permissions, read as the
          # setup made it (Start-TempWatch in native-libraries.ps1).
          $watch = $null
          if ('${{ matrix.route }}' -eq 'setup') {
            . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
            $stop = Join-Path $env:RUNNER_TEMP 'setup-temp.stop'
            $watch = Start-TempWatch (Join-Path $env:RUNNER_TEMP 'setup-temp.txt') $stop
          }
          $runStarted = Get-Date
          "RUN_STARTED=$($runStarted.ToUniversalTime().ToString('o'))" | Add-Content $env:GITHUB_ENV
          $run = Run $env:EXE
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'update-run.txt') -Value $run.Output -NoNewline
          "UPDATE_EXIT=$($run.ExitCode)" | Add-Content $env:GITHUB_ENV
          "UPDATE_PID=$($run.Id)" | Add-Content $env:GITHUB_ENV
          $run.Output
          "Exit code: $($run.ExitCode)"
          # The newer version's replace runs detached from the staging folder once both
          # copies have ended, and on the setup's copy starts the setup, which starts its
          # setup.tmp from an is-*.tmp folder in a temp folder. Each is waited for, so the
          # record and the checks see what they left. One still running after 300 s is named
          # for the checks, which fail on it.
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          $left = Wait-StagingProcesses 300 $runStarted -SetupTemp:('${{ matrix.route }}' -eq 'setup')
          if ($watch) { Stop-TempWatch $watch $stop }
          if ($left) { "Still running 300 s after the update run ended: $($left -join ', ')" | Set-Content (Join-Path $env:RUNNER_TEMP 'update-stuck.txt') }
          else { '  nothing the update started is running' }

      - name: Stop recording
        if: always() && env.PROCMON != ''
        continue-on-error: true
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $csv = Stop-Record 'update'
          "UPDATE_RECORD=$csv" | Add-Content $env:GITHUB_ENV

      # What the update left, read before the checks make their second run,
      # which changes it. This explains a result and decides none, so it runs
      # whatever happened and never fails the job.
      #
      # Every file beside the exe is described with the release's own command
      # line, so a file that is not the release's shows by its hash, and so is
      # every file in a staging folder under %ProgramData%, which is what the
      # newer version ran from. On the setup's copy the Security log gives every
      # process start and exit and the Application log its entries, each to the
      # millisecond.
      - name: Describe what the update left
        if: always() && env.EXE != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Stamp([datetime]$t) { $t.ToUniversalTime().ToString('HH:mm:ss.fff') }
          function Describe([string]$path) {
            $item = Get-Item -LiteralPath $path
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            "  $path"
            "    FileVersion $($info.FileVersion), ProductVersion $($info.ProductVersion)"
            "    $($item.Length) bytes, last written $(Stamp $item.LastWriteTime) UTC"
            "    SHA-256 $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $exe = $env:EXE
          $folder = Split-Path $exe
          $since = [datetime]::Parse($env:RUN_STARTED).ToUniversalTime()
          "The update run started at $(Stamp $since) UTC."

          "The command line's files beside the exe, read at $(Stamp (Get-Date)) UTC:"
          Get-ChildItem -LiteralPath $folder -Filter 'installerclean-cli.exe*' | ForEach-Object { Describe $_.FullName }

          "The files in the staging folders under $env:ProgramData`:"
          . scripts/native-libraries.ps1
          Get-ChildItem -LiteralPath $env:ProgramData -Directory -Filter "$(Split-Path (Get-StagingPrefix) -Leaf)*" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -File } | ForEach-Object { Describe $_.FullName }

          $release = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          gh release download "v$env:LATEST" --repo $env:GITHUB_REPOSITORY --pattern installerclean-cli.exe --dir $release --clobber
          "The release's own command line:"
          Describe (Join-Path $release 'installerclean-cli.exe')

          if ('${{ matrix.route }}' -ne 'setup') { return }

          "The Application log, source InstallerClean, from the update run on:"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean'; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue |
            Sort-Object TimeCreated | ForEach-Object { "  $(Stamp $_.TimeCreated)  $($_.Id)  $($_.Message)" }

          "Every process started or ended from the update run on, from the Security log:"
          Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4688, 4689; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue |
            Sort-Object TimeCreated | ForEach-Object {
              $data = @{}
              foreach ($d in ([xml]$_.ToXml()).Event.EventData.Data) { $data[$d.Name] = $d.'#text' }
              if ($_.Id -eq 4688) {
                "  $(Stamp $_.TimeCreated)  start  $($data.NewProcessName) pid $([Convert]::ToInt32($data.NewProcessId, 16)), started by $($data.ParentProcessName) pid $([Convert]::ToInt32($data.ProcessId, 16))"
              } else {
                "  $(Stamp $_.TimeCreated)  exit   $($data.ProcessName) pid $([Convert]::ToInt32($data.ProcessId, 16)), status $($data.Status)"
              }
            } | Where-Object { $_ -notmatch '\\(conhost|svchost|WmiPrvSE|backgroundTaskHost|RuntimeBroker|auditpol)\.exe' }

      # Every check runs and prints what it read, and the step fails if any of
      # them did. The lines the command line prints are built from Strings.resx,
      # so a reworded string moves the check with it. The runner's UI language
      # has no satellite, so the command line prints the neutral English.
      #
      # The crash log is not required to be empty: a scan writes entries of its
      # own for registrations it cannot read, on any machine. What fails is an
      # entry for an assembly that could not be loaded or for an update that
      # failed, other than the one saying a release that refuses the switches
      # ended before it said it had started.
      #
      # The permissions are compared with a file the same account makes in the
      # same folder. On the command line's own download that file is the
      # update's own work, written into the folder; on the setup's copy the setup
      # writes it, so there the check reads what the setup leaves.
      - name: Check the result
        shell: pwsh
        run: |
          # For Get-ReplaceSuffixes and Get-StagingPrefix. Its Fail and its failures are
          # replaced here.
          . scripts/native-libraries.ps1
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }
          function Same($a, $b) {
            $a = $a -as [version]; $b = $b -as [version]
            $null -ne $a -and $null -ne $b -and
              $a.Major -eq $b.Major -and $a.Minor -eq $b.Minor -and [Math]::Max($a.Build, 0) -eq [Math]::Max($b.Build, 0)
          }

          . (Join-Path $env:RUNNER_TEMP 'run.ps1')

          $resx = [xml](Get-Content -Raw src/InstallerClean.Core/Resources/Strings.resx)
          function Line([string]$name) {
            $value = ($resx.root.data | Where-Object name -eq $name).value
            if (-not $value) { throw "Strings.resx has no $name." }
            $value
          }

          $exe = $env:EXE
          $folder = Split-Path $exe
          $old = $env:OLD_VERSION
          $latest = $env:LATEST

          $run = [pscustomobject]@{
            ExitCode = [int]$env:UPDATE_EXIT
            Output = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'update-run.txt')
          }

          # A release that refuses the switches runs nothing and writes its own 4000, and
          # the old copy runs the command itself, so the file stays the old copy.
          $staged = $env:STAGED -eq 'true'
          $runningNewer = (Line 'Cli.UpdateRunningNewer') -f '/s', $latest
          $notRun = Line 'Cli.UpdateNotRun'
          $runningInstead = (Line 'Cli.UpdateRunningInstead') -f '/s', $old
          $wanted = if ($staged) { $latest } else { $old }
          if ($staged) { "The update to $latest, run by the newer version:" }
          else { "The update to $latest, which refuses the switches, so the old copy runs the command itself:" }

          "The command line's output:"
          foreach ($expected in @(
              ((Line 'UpdateNotice.Available') -f $latest),
              ((Line 'UpdateNotice.Downloading') -f $latest)) + $(if ($staged) { @($runningNewer) } else { @($notRun, $runningInstead) })) {
            if ($run.Output.Contains($expected)) { "  printed: $expected" } else { Fail "It did not print: $expected" }
          }
          foreach ($unexpected in @(
              (Line 'UpdateNotice.DownloadFailed')) + $(if ($staged) { @($notRun, $runningInstead) } else { @($runningNewer) })) {
            if ($run.Output.Contains($unexpected)) { Fail "It printed: $unexpected" } else { "  did not print: $unexpected" }
          }

          $stuck = Join-Path $env:RUNNER_TEMP 'update-stuck.txt'
          if (Test-Path -LiteralPath $stuck) { Fail (Get-Content -Raw -LiteralPath $stuck).Trim() }

          "The files:"
          $files = @($exe)
          if ('${{ matrix.route }}' -eq 'setup') { $files += Join-Path $folder 'InstallerClean.exe' }
          foreach ($f in $files) {
            $v = (Get-Item $f).VersionInfo.FileVersion
            if (Same $v $wanted) { "  $f carries $v" } else { Fail "$f carries $v, not $wanted." }
          }
          if ('${{ matrix.route }}' -eq 'setup') {
            $shown = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1').DisplayVersion
            if (Same $shown $wanted) { "  the uninstall key's DisplayVersion is $shown" } else { Fail "The uninstall key's DisplayVersion is $shown, not $wanted." }
          }
          foreach ($suffix in @(Get-ReplaceSuffixes) + '.old', '.new') {
            $left = "$exe$suffix"
            if (Test-Path -LiteralPath $left) { Fail "$left is still there." } else { "  no $left" }
          }

          "The permissions:"
          $control = Join-Path $folder 'permissions-control.tmp'
          Set-Content -Path $control -Value ''
          $made = (Get-Acl $control).GetSecurityDescriptorSddlForm('Access')
          Remove-Item $control
          $updated = (Get-Acl $exe).GetSecurityDescriptorSddlForm('Access')
          "  a file made in the folder: $made"
          "  the updated file:          $updated"
          if ($updated -ne $made) { Fail "$exe does not have the permissions a file made in its folder has." }

          "The Application log, source InstallerClean:"
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean' } -ErrorAction SilentlyContinue |
                      Sort-Object TimeCreated)
          foreach ($e in $events) { "  $($e.Id)  $($e.Message)" }
          $notInstalled = @($events | Where-Object Id -eq (Get-NothingAtPathEventId))
          $summaries = @($events | Where-Object { $_.Id -in 1000, 1002, 2000, 4000 })
          $unavailable = $run.Output.Contains((Line 'Cli.EventLogUnavailable'))
          $expectedId, $otherId, $like = if ($staged) { 3005, 3006, ('*' + ((Line 'Cli.EventLogUpdated') -f '/s', $old, $latest, '/s') + '*') } else { 3006, 3005, ('*' + ((Line 'Cli.EventLogUpdateNotRun') -f '/s', $old, $latest) + '*') }
          $expectedEntries = @($events | Where-Object Id -eq $expectedId)
          if ($expectedEntries.Count -ne 1) {
            Fail "$($expectedEntries.Count) entries with Event ID $expectedId, where one was expected$(if ($unavailable) { '; the run printed that the Application log refused its entries' })."
          } elseif ($expectedEntries[0].Message -notlike $like) {
            Fail "The $expectedId entry is not like '$like'."
          }
          $other = @($events | Where-Object Id -eq $otherId)
          if ($other) { Fail "$($other.Count) entries with Event ID $otherId." }
          if ($notInstalled) { Fail "$($notInstalled.Count) entries with Event ID $(Get-NothingAtPathEventId)." }
          # The run's own summary, and against a release that refuses the switches, the 4000
          # that release writes for them.
          $refusals = @($summaries | Where-Object Id -eq 4000)
          $own = @($summaries | Where-Object Id -ne 4000)
          $wantRefusals = if ($staged) { 0 } else { 1 }
          if ($own.Count -ne 1) { Fail "$($own.Count) run summaries other than 4000, where the run's own was expected alone." }
          if ($refusals.Count -ne $wantRefusals) { Fail "$($refusals.Count) entries with Event ID 4000, where $wantRefusals was expected." }

          "The crash log:"
          $logs = @(
            (Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'),
            (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean\crash.log'))
          # Against a release that refuses the switches, the old copy writes the one line
          # saying the newer version ended before it said it had started, and that line alone
          # is expected.
          $notStartedLines = 0
          # The end of that line, read from NewerVersionProcess.cs so a reworded line moves
          # the check with it.
          $notStartedText = ' before it said it had started.'
          if (-not (Get-Content -Raw src/InstallerClean.Core/Services/NewerVersionProcess.cs).Contains($notStartedText)) { throw "NewerVersionProcess.cs no longer ends a line with '$notStartedText'." }
          foreach ($log in $logs) {
            if (-not (Test-Path $log)) { "  no $log"; continue }
            "  $log holds:"
            Get-Content $log | ForEach-Object { "    $_" }
            $hits = @(foreach ($pattern in 'Could not load file or assembly', 'UpdateFailedException') { Select-String -Path $log -SimpleMatch $pattern })
            $expectedHits = @($hits | Where-Object { -not $staged -and $_.Line.Contains('UpdateFailedException') -and $_.Line.Contains($notStartedText) })
            $notStartedLines += $expectedHits.Count
            foreach ($h in @($hits | Where-Object { $_ -notin $expectedHits })) { Fail "$log line $($h.LineNumber): $($h.Line.Trim())" }
          }
          if (-not $staged -and $notStartedLines -ne 1) { Fail "The crash logs hold $notStartedLines lines saying the newer version ended before it said it had started, where they hold one." }

          "The exit code:"
          Write-Host "::group::A second run of the file now at the path"
          $again = Run $exe
          $again.Output
          "Exit code: $($again.ExitCode)"
          Write-Host "::endgroup::"
          "  the update run exited with $($run.ExitCode), the second run with $($again.ExitCode)"
          if ($run.ExitCode -ne 0) { Fail "The update run exited with $($run.ExitCode)." }
          if ($run.ExitCode -ne $again.ExitCode) { Fail "The update run's exit code is not that of the file now at the path." }

          # The staging folder stays until a copy's next start takes it away, which the second
          # run was.
          "The download folders:"
          $stagingFolders = @(Get-ChildItem $env:ProgramData -Directory -Filter "$(Split-Path (Get-StagingPrefix) -Leaf)*" -ErrorAction SilentlyContinue)
          if ($stagingFolders) { Fail "Download folders are left under ${env:ProgramData} after the second run: $($stagingFolders.Name -join ', ')" } else { "  no download folder under $env:ProgramData" }

          if ($failures.Count -gt 0) {
            "$($failures.Count) checks failed:"
            $failures | ForEach-Object { "  $_" }
            exit 1
          }
          'Every check passed.'

      # The old copy is judged by its process ID. The job fails where the old copy
      # loads an image from its own folder other than its own exe, and where it shows no
      # act of its own code or never loads winhttp.dll, which would leave too little of
      # the update recorded to judge. Every look it makes for a file to load in its own
      # folder or under %TEMP%\.net is printed, with those the list names. The paths of the looks the list does not name are written
      # down for the step after this one, which plants them on the command line's own
      # download, less hostfxr.dll and hostpolicy.dll: a build that takes a planted copy
      # of either may not start at all.
      #
      # The old copy starts one installerclean-cli.exe, the newer command line from a
      # staging folder, and the job fails where it started none, more than one, one from
      # anywhere else, or any other process but the console host in System32, which
      # Windows starts itself. Every process it starts is printed. What that process does,
      # the setup it starts on the setup's copy included, is the release's and is not
      # judged here.
      - name: Judge what the update looked for and loaded
        if: ${{ !cancelled() && env.UPDATE_PID != '' }}
        shell: pwsh
        run: |
          if (-not $env:UPDATE_RECORD -or -not (Test-Path -LiteralPath $env:UPDATE_RECORD)) { throw "Process Monitor saved no record of the update, so its looks were not judged." }
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          # The run takes the build's label, which is how the list matches its entries to it.
          $build = $builds[0]
          $notPlanted = @(Select-NotPlanted @(Get-NotPlanted) $builds -OnlyWhatThisRuns)
          $old = [pscustomobject]@{ Label = $build.Label; Build = $build; Folder = (Split-Path $env:EXE); Exe = (Split-Path $env:EXE -Leaf); Id = [int]$env:UPDATE_PID }
          $byProcess = Read-Record $env:UPDATE_RECORD @($old)
          $read = Read-Run $old $byProcess
          $kept = [System.Collections.Generic.List[string]]::new()
          $kept.Add("$($old.Id)`t$($old.Exe)")
          if ($read) {
            Test-MustLoad $old $read.Loads
            if (-not $read.Marker) { Fail "The old copy showed no act of its own code." }
            elseif ($read.Marker.Kind -ne $build.Marker) { Fail "The old copy's first act of its own code seen is the $($read.Marker.Kind) at row $($read.Marker.Index), where it should be the $($build.Marker)." }
            foreach ($load in ($read.Loads | Where-Object Place -eq 'own')) {
              Fail "The old copy loaded $($load.Path) from its own folder, row $($load.Index), $(Get-When $load $read.Marker)."
            }
            $extractionFolders = @($read.Loads | Where-Object Place -eq 'extraction' | ForEach-Object { Split-Path $_.Path } | Sort-Object -Unique)
            $bundleFiles = @(foreach ($folder in $extractionFolders) { Get-ChildItem -LiteralPath $folder -File | ForEach-Object FullName })
            $plants = @(Get-RunPlants $old $read $notPlanted @{} $extractionFolders |
              Where-Object { -not ($_.Place -eq 'beside' -and (Split-Path $_.Path -Leaf) -in $plantedAlone) })
            "== The looks the list does not name"
            if (-not $plants) { '  none' }
            foreach ($plant in $plants) { "  $($plant.Place) $($plant.Path): $($plant.Kind), $($plant.Source)" }
            ConvertTo-Json -Depth 5 -InputObject ([pscustomobject]@{ Plants = $plants; BundleFiles = $bundleFiles }) |
              Set-Content (Join-Path $env:RUNNER_TEMP 'plants.json')

            $prefix = Get-StagingPrefix
            $allCreated = @($byProcess[(Get-RunKey $old)] | Where-Object Operation -eq 'Process Create')
            foreach ($row in $allCreated) { "  the old copy started $($row.Path)" }
            $created = @($allCreated | Where-Object { (Split-Path $_.Path -Leaf) -eq 'installerclean-cli.exe' })
            # The console host Windows starts for a console program from System32 may sit
            # beside it, and nothing else: a setup, a crash report or anything the old copy
            # starts on its own fails.
            $conhost = Join-Path $env:SystemRoot 'System32\conhost.exe'
            foreach ($row in @($allCreated | Where-Object { (Split-Path $_.Path -Leaf) -ne 'installerclean-cli.exe' })) {
              if (($row.Path -replace '^\\\?\?\\', '') -eq $conhost) { "  $($row.Path) is the console host Windows starts, so it is allowed" }
              else { Fail "The old copy started $($row.Path), where it starts only installerclean-cli.exe from a staging folder." }
            }
            if ($created.Count -ne 1) { Fail "The old copy started $($created.Count) installerclean-cli.exe processes, where it starts one, the newer command line from a staging folder." }
            elseif (-not $created[0].Path.StartsWith($prefix, 'OrdinalIgnoreCase')) {
              Fail "The old copy started $($created[0].Path), where it starts installerclean-cli.exe from a folder under $prefix."
            }
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'kept-update.txt') -Value $kept
          Exit-IfFailed

      # The release's setup, started on the setup's copy by the newer version once both
      # copies have ended, runs setup.tmp from an is-*.tmp folder Inno Setup's loader makes
      # in a temp folder. Each such folder the watch saw made is printed with its owner and its
      # permissions, and the step fails where it saw none, since the setup then did not
      # run as an update to a release that runs the newer version does.
      - name: Print the temp folders the release's setup made
        if: ${{ !cancelled() && matrix.route == 'setup' && env.STAGED == 'true' && env.UPDATE_PID != '' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'setup-temp.txt'
          . scripts/native-libraries.ps1
          "The is-*.tmp folders made in $((Get-TempFolders) -join ', ') by the release's setup (path, owner, permissions):"
          $made = @(Get-Content $out -ErrorAction SilentlyContinue | Where-Object { $_ })
          foreach ($line in $made) { "  $line" }
          if (-not $made) { "::error::The watch on the temp folders saw no is-*.tmp folder made, so the release's setup did not run."; exit 1 }
          # setup.tmp is the release's setup's own: the Security log, which audits each
          # process start on the setup's copy, has to show one starting from a folder the
          # watch saw made, each path compared in its long spelling.
          $folders = @($made | ForEach-Object { $path = ($_ -split "`t")[0]; $long = Get-FullPath $path; "$(if ($long) { $long } else { $path })".TrimEnd('\') + '\' })
          $since = [datetime]::Parse($env:RUN_STARTED)
          $starts = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4688; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue | ForEach-Object {
            $name = (([xml]$_.ToXml()).Event.EventData.Data | Where-Object Name -eq 'NewProcessName').'#text'
            $long = Get-FullPath $name
            if ($long) { $long } else { $name }
          } | Where-Object { $path = $_; @($folders | Where-Object { $path.StartsWith($_, 'OrdinalIgnoreCase') }).Count })
          foreach ($start in $starts) { "  started from one of them: $start" }
          if (-not $starts) { "::error::No process started from an is-*.tmp folder the watch saw made, so the folders printed are not shown to be the release's setup's."; exit 1 }

      # A copy of this build at the older version is put in a folder of its own with the
      # genuine file at every path the step above wrote down, and makes the update
      # again. The event source the first update registered is deleted first, so this
      # run registers it as the first did and its looks while it does are planted for
      # too. The job fails where the old copy reads or loads a planted file or any image its
      # bundle did not put under %TEMP%\.net, and where a plant was not looked for, not
      # found, gone or changed. Its exit code and output are not judged; the entries the
      # crash log gains are printed.
      - name: Update again with the genuine files planted
        if: ${{ !cancelled() && matrix.route == 'download' && env.UPDATE_PID != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          . (Join-Path $env:RUNNER_TEMP 'run.ps1')
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (-not (Test-Path $plantsFile)) { throw "The judging step wrote nothing to plant." }
          $plan = Get-Content -Raw $plantsFile | ConvertFrom-Json
          $build = $builds[0]

          if ([System.Diagnostics.EventLog]::SourceExists('InstallerClean')) { [System.Diagnostics.EventLog]::DeleteEventSource('InstallerClean') }
          if ([System.Diagnostics.EventLog]::SourceExists('InstallerClean')) { throw "The InstallerClean event source is still registered." }
          '  the InstallerClean event source is not registered'

          $folder = Join-Path $env:RUNNER_TEMP 'second-update'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item publish/cli/installerclean-cli.exe $folder
          $exe = Join-Path $folder 'installerclean-cli.exe'
          foreach ($suffix in @(Get-ReplaceSuffixes) + '.old', '.new') { if (Test-Path -LiteralPath "$exe$suffix") { throw "$exe$suffix is there before the run." } }
          $placed = @(Add-Plants $folder @($plan.Plants))
          "  planted $($placed.Count): $(($placed | ForEach-Object Path) -join ', ')"

          $logs = @(foreach ($name in $crashLogFolders) {
            $log = Join-Path $env:LOCALAPPDATA "$name\crash.log"
            [pscustomobject]@{ Path = $log; Length = $(if (Test-Path -LiteralPath $log) { (Get-Item -LiteralPath $log).Length } else { 0 }) }
          })

          Start-Record 'second'
          try {
            $secondStarted = Get-Date
            $run = Run $exe 600
            # Its replace runs from a staging folder once it has ended, and is recorded too.
            $left = Wait-StagingProcesses 300 $secondStarted
            if ($left) { Fail "Still running 300 s after the second update run ended: $($left -join ', ')" }
          }
          finally { $csv = Stop-Record 'second' }
          "  the run exited with $($run.ExitCode)"

          $old = [pscustomobject]@{ Label = $build.Label; Build = $build; Folder = $folder; Exe = 'installerclean-cli.exe'; Id = $run.Id
            Placed = $placed; BundleFiles = @($plan.BundleFiles | Where-Object { $_ }) }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'kept-second.txt') -Value "$($old.Id)`t$($old.Exe)"
          $byProcess = Read-Record $csv @($old)
          $read = Read-Run $old $byProcess
          if ($read) {
            Test-PlantedRun $old $read
            Test-MustLoad $old $read.Loads
          }

          foreach ($log in $logs) {
            if (-not (Test-Path -LiteralPath $log.Path)) { continue }
            $stream = [IO.File]::Open($log.Path, 'Open', 'Read', 'ReadWrite')
            try {
              $null = $stream.Seek($log.Length, 'Begin')
              $added = [IO.StreamReader]::new($stream).ReadToEnd()
            }
            finally { $stream.Dispose() }
            if ($added) { "  $($log.Path) gained:"; $added -split "`r?`n" | Where-Object { $_ } | ForEach-Object { "    $_" } }
          }
          Exit-IfFailed

      # Only the rows of the processes judged are kept, each matched by its process ID and
      # its name, since Windows can give a later process an ID an earlier one had. The
      # Detail of each Process Start and Process Create row is emptied, since those carry
      # a process's environment and its command line. The artifact is public.
      - name: Keep the Process Monitor rows
        if: always() && env.PROCMON != ''
        shell: pwsh
        run: |
          $kept = Join-Path $env:RUNNER_TEMP 'kept'
          New-Item -ItemType Directory -Force -Path $kept | Out-Null
          foreach ($name in 'update', 'second') {
            $csv = Join-Path $env:RUNNER_TEMP "procmon\$name.csv"
            $ids = Join-Path $env:RUNNER_TEMP "kept-$name.txt"
            if (-not (Test-Path $csv) -or -not (Test-Path $ids)) { "  no $name record to keep"; continue }
            $pids = @(Get-Content $ids | Where-Object { $_ } | ForEach-Object { ($_ -split "`t")[0] })
            $names = @{}
            foreach ($line in @(Get-Content $ids | Where-Object { $_ })) { $id, $name = $line -split "`t"; $names[$id] = $name }
            $rows = @(Import-Csv $csv | Where-Object { $_.PID -in $pids -and $_.'Process Name' -eq $names[$_.PID] } | ForEach-Object {
              if ($_.Operation -in 'Process Start', 'Process Create') { $_.Detail = '' }
              $_
            })
            $rows | Export-Csv -Path (Join-Path $kept "$name.csv") -NoTypeInformation -UseQuotes Always
            "  kept $($rows.Count) rows of $csv, for the processes $($pids -join ', ')"
          }

      - name: Upload the Process Monitor rows
        if: always() && env.PROCMON != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-monitor-records-${{ matrix.route }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kept
          if-no-files-found: warn
          retention-days: 7

      # "Check the result" prints all of this itself, unless it stopped before its
      # end. On the command line's own download the entries of the update made again
      # with the files planted come after the first update's.
      - name: Print the crash log and the Application log
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in (Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean\crash.log')) {
            if (Test-Path $log) { "$log holds:"; Get-Content $log } else { "No $log." }
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean' } -ErrorAction SilentlyContinue |
            Sort-Object TimeCreated | ForEach-Object { "$($_.Id)  $($_.Message)" }

      - name: Print the setup's log
        if: always() && matrix.route == 'setup'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'setup-install.log'
          if (Test-Path $log) { Get-Content $log } else { "No $log." }
