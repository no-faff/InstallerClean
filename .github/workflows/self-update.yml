# Updates a copy of the command line built from the v3.5.0 tag, on .NET 10, to the .NET
# Framework 4.8 builds of the pushed commit, on a Windows runner, the way a copy on
# somebody's machine updates itself.
#
# The old copy is the tag's command line published as a single file with the Debug
# configuration, so it reads INSTALLERCLEAN_DEBUG_PRETEND_LATEST, which has its update
# check answer that the version the commit builds is the newest release, and
# INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST, INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD and
# INSTALLERCLEAN_DEBUG_LOCAL_SETUP, which have it read an update.json and take the newer
# command line and the setup from files in place of GitHub's. The newer files are the
# commit's own merged command line and the setup built from the commit's script, which
# carry the merged exes, so what the old copy downloads, checks and starts is what a
# release would carry. The old copy is run with /s and its input and output redirected,
# which is how a scheduled task or a script runs it: it updates without asking, and the
# newer version runs the command as given. One leg runs it as the command line's own
# download, from a folder of its own; the other installs the tag's setup and runs the copy
# the setup put in Program Files. Each leg has a runner to itself, so neither route's files,
# registry or Application-log entries can answer for the other's.
#
# What this covers is the half of an update the old copy does: finding the newer version,
# downloading it into a staging folder and handing the run over to it there, and the half the
# newer version does: running the command and putting itself, or its setup, at the running
# copy's path once both have ended. The checks read what the update left.
#
# Three more legs update the window the same way, from a folder of its own: the tag's
# window, published as a Debug single file and told by INSTALLERCLEAN_DEBUG_PRETEND_COPY
# whether it is the portable or the slim, offers the commit's merged window as its update,
# and an update button is pressed through UI Automation, as a user would press it. The
# window opens with the card offering the update over the scan, and the update notice sits
# at the top of the scan behind it; each has its own Update now. The portable's leg and
# the slim's press the card's. The notice's leg, a portable, presses the card's Continue
# without updating, which takes the card away, and then the notice's. The checks read the
# file at the path, which keeps its name, the newer window it starts and the Application
# log, where a window that updated writes nothing.
#
# No command line the job runs makes a request of the network: the old copy's check is
# answered by the Debug switch, and the newer version is started with /noupdate. The newer
# window, which the replace starts as a user would start it, checks GitHub for a newer
# release as any copy does.

name: Self-update

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only.
permissions:
  contents: read

env:
  # The release the old copy is built from. Its Debug switches are what let the update be
  # tried offline against this commit's builds.
  OLD_TAG: v3.5.0
  OLD_VERSION: '3.5.0'

jobs:
  update:
    name: Update ${{ matrix.title }}
    # The same image as ci.yml and release.yml.
    runs-on: windows-2025
    timeout-minutes: 45

    strategy:
      fail-fast: false
      # A window leg names the copy the old window takes itself for and the Update now it
      # presses: the card's, or the notice's once the card has gone.
      matrix:
        include:
          - route: download
            title: the command line's own download
          - route: setup
            title: the setup's copy
          - route: window
            title: the portable by the card's Update now
            window: true
            copy: portable
            button: card
          - route: slim
            title: the slim by the card's Update now
            window: true
            copy: slim
            button: card
          - route: notice
            title: the portable by the update notice's Update now
            window: true
            copy: portable
            button: notice

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The version this commit builds, which the old copy is told is the newest release.
      - name: Read the version this commit builds
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not ($version -as [version])) { throw "Directory.Build.props holds no version." }
          if ([version]$version -le [version]$env:OLD_VERSION) { throw "This commit builds $version, which is not newer than $env:OLD_VERSION, so there is nothing to update to." }
          "  This commit builds $version; the old copy is $env:OLD_VERSION."
          "NEWER_VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Extract the old version's source
        shell: pwsh
        run: |
          $tree = Join-Path $env:RUNNER_TEMP 'old-tree'
          git archive --format=zip -o "$tree.zip" $env:OLD_TAG
          if ($LASTEXITCODE -ne 0) { throw "git archive failed for $env:OLD_TAG." }
          Expand-Archive -Path "$tree.zip" -DestinationPath $tree -Force
          "OLD_TREE=$tree" | Add-Content $env:GITHUB_ENV

      - name: Publish the old version's command line
        if: matrix.route == 'download' || matrix.route == 'setup'
        run: dotnet publish "$env:OLD_TREE/src/InstallerClean.Cli/InstallerClean.Cli.csproj" -c Debug -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o "$env:OLD_TREE/publish/cli"

      - name: Publish the old version's window
        if: matrix.route != 'download'
        run: dotnet publish "$env:OLD_TREE/src/InstallerClean/InstallerClean.csproj" -c Debug -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o "$env:OLD_TREE/publish/self-contained"

      - name: Build the newer version's two exes
        run: |
          dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "The newer command line did not build." }
          dotnet build src/InstallerClean/InstallerClean.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "The newer window did not build." }

      - name: Install Inno Setup
        if: matrix.route == 'setup'
        run: choco install innosetup --version=6.7.1 --no-progress -y

      # Each setup is compiled from the script of the tree whose exes it carries: the old
      # one from the tag, the newer from this commit.
      - name: Compile the old and the newer setup
        if: matrix.route == 'setup'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          Push-Location $env:OLD_TREE
          & $iscc "/DAppVersion=$env:OLD_VERSION" installer\InstallerClean.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for the old version." }
          Pop-Location
          & $iscc "/DAppVersion=$env:NEWER_VERSION" installer\InstallerClean.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for the newer version." }
          foreach ($path in "$env:OLD_TREE/publish/InstallerClean-$env:OLD_VERSION-setup.exe", "publish/InstallerClean-$env:NEWER_VERSION-setup.exe") {
            if (-not (Test-Path $path)) { throw "$path was not written." }
          }

      # The update.json the old copy reads as the release's.
      - name: Write the update.json
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'update.json'
          node scripts/write-update-manifest.mjs $manifest setup portable slim cli
          if ($LASTEXITCODE -ne 0) { throw "The writer did not write $manifest." }
          "UPDATE_MANIFEST=$manifest" | Add-Content $env:GITHUB_ENV

      # The setup's copy is recognised by the folder the setup records in its
      # uninstall key, so the path is read from there rather than assumed. A window
      # left running would hold the single-instance mutex, which the newer setup
      # stops for, so the step fails on one rather than letting the update fail
      # for a reason that is not the code.
      - name: Put the older version in place
        if: matrix.route == 'download' || matrix.route == 'setup'
        shell: pwsh
        run: |
          if ('${{ matrix.route }}' -eq 'setup') {
            $setup = (Resolve-Path "$env:OLD_TREE/publish/InstallerClean-$env:OLD_VERSION-setup.exe").Path
            $log = Join-Path $env:RUNNER_TEMP 'setup-install.log'
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "The setup exited with code $($p.ExitCode)." }
            $key = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1' -ErrorAction Stop
            $folder = $key.InstallLocation.TrimEnd('\')
            if (Get-Process InstallerClean -ErrorAction SilentlyContinue) { throw "InstallerClean is running after the silent install." }
          } else {
            $folder = Join-Path $env:RUNNER_TEMP 'download'
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item "$env:OLD_TREE/publish/cli/installerclean-cli.exe" $folder
          }
          $exe = Join-Path $folder 'installerclean-cli.exe'
          $files = @($exe)
          if ('${{ matrix.route }}' -eq 'setup') { $files += Join-Path $folder 'InstallerClean.exe' }
          foreach ($f in $files) {
            $v = (Get-Item $f).VersionInfo.FileVersion
            "  $f carries $v"
            if (-not $v.StartsWith("$env:OLD_VERSION.")) { throw "$f carries $v, not $env:OLD_VERSION." }
          }
          "EXE=$exe" | Add-Content $env:GITHUB_ENV

      # Process creation and exit are audited on the setup's copy, so the Security
      # log can show when the setup and every process it starts begin and end,
      # against when the command line reads what the setup left.
      - name: Audit process starts and exits
        if: matrix.route == 'setup'
        run: |
          auditpol /set /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /success:enable
          if ($LASTEXITCODE -ne 0) { throw "auditpol could not turn on Process Creation." }
          auditpol /set /subcategory:'{0CCE922C-69AE-11D9-BED3-505054503030}' /success:enable
          if ($LASTEXITCODE -ne 0) { throw "auditpol could not turn on Process Termination." }

      # Standard input and output both redirected, which is what makes the run
      # one nobody can answer. The newer version is started in the same console
      # and inherits the output, so it is read to the end of both. The function
      # is kept in a file for the second run the checks make.
      - name: Run the update
        if: matrix.route == 'download' || matrix.route == 'setup'
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'run.ps1'
          Set-Content -Path $helper -Value @'
          function Run([string]$exe, [int]$seconds = 0, [hashtable]$environment = @{}, [string[]]$arguments = @('/s')) {
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $info.ArgumentList.Add($a) }
            $info.UseShellExecute = $false
            foreach ($name in $environment.Keys) { $info.Environment[$name] = $environment[$name] }
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($info)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            if ($seconds -gt 0) {
              if (-not $p.WaitForExit($seconds * 1000)) {
                $p.Kill($true)
                throw "$exe was still running after $seconds s and was ended."
              }
            }
            $p.WaitForExit()
            [pscustomobject]@{ ExitCode = $p.ExitCode; Output = $out.Result + $err.Result; Id = $p.Id }
          }
          '@
          . $helper
          # On the setup's copy a job writes down each is-*.tmp folder that appears in a
          # temp folder (Get-TempFolders) while the update runs, with its owner and its permissions, read as the
          # setup made it (Start-TempWatch in native-libraries.ps1).
          $watch = $null
          if ('${{ matrix.route }}' -eq 'setup') {
            . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
            $stop = Join-Path $env:RUNNER_TEMP 'setup-temp.stop'
            $watch = Start-TempWatch (Join-Path $env:RUNNER_TEMP 'setup-temp.txt') $stop
          }
          $runStarted = Get-Date
          "RUN_STARTED=$($runStarted.ToUniversalTime().ToString('o'))" | Add-Content $env:GITHUB_ENV
          $switches = @{
            INSTALLERCLEAN_DEBUG_PRETEND_LATEST = "v$env:NEWER_VERSION"
            INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST = $env:UPDATE_MANIFEST
            INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD = (Resolve-Path 'publish/cli/installerclean-cli.exe').Path
          }
          # Only the setup's copy takes a setup, and the download route builds none.
          if ('${{ matrix.route }}' -eq 'setup') { $switches.INSTALLERCLEAN_DEBUG_LOCAL_SETUP = (Resolve-Path "publish/InstallerClean-$env:NEWER_VERSION-setup.exe").Path }
          $run = Run $env:EXE 0 $switches
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'update-run.txt') -Value $run.Output -NoNewline
          "UPDATE_EXIT=$($run.ExitCode)" | Add-Content $env:GITHUB_ENV
          "UPDATE_PID=$($run.Id)" | Add-Content $env:GITHUB_ENV
          $run.Output
          "Exit code: $($run.ExitCode)"
          # The newer version's replace runs detached from the staging folder once both
          # copies have ended, and on the setup's copy starts the setup, which starts its
          # setup.tmp from an is-*.tmp folder in a temp folder. Each is waited for, so the
          # record and the checks see what they left. One still running after 300 s is named
          # for the checks, which fail on it.
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          $left = Wait-StagingProcesses 300 $runStarted -SetupTemp:('${{ matrix.route }}' -eq 'setup')
          if ($watch) { Stop-TempWatch $watch $stop }
          if ($left) { "Still running 300 s after the update run ended: $($left -join ', ')" | Set-Content (Join-Path $env:RUNNER_TEMP 'update-stuck.txt') }
          else { '  nothing the update started is running' }

      # The window's legs. The old window goes in a folder of its own under the name the
      # portable or the slim is downloaded as.
      - name: Put the older window in place
        if: matrix.window
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $name = if ('${{ matrix.copy }}' -eq 'slim') { 'InstallerClean-slim.exe' } else { 'InstallerClean-portable.exe' }
          $exe = Join-Path $folder $name
          Copy-Item "$env:OLD_TREE/publish/self-contained/InstallerClean.exe" $exe
          $v = (Get-Item $exe).VersionInfo.FileVersion
          "  $exe carries $v"
          if (-not $v.StartsWith("$env:OLD_VERSION.")) { throw "$exe carries $v, not $env:OLD_VERSION." }
          if (Get-Process InstallerClean, InstallerClean-portable, InstallerClean-slim -ErrorAction SilentlyContinue) { throw "InstallerClean is already running." }
          "WINDOW_EXE=$exe" | Add-Content $env:GITHUB_ENV

      # Windows PowerShell, where UI Automation's assemblies are part of the framework. The
      # step is elevated, as the window is, which UI Automation needs to reach it. A button
      # is pressed only once it is enabled and on screen. The card's legs press the card's
      # Update now. The notice's leg prints both Update nows while the card is up, presses
      # the card's Continue without updating, waits for the card's Update now to leave the
      # screen and presses the notice's. Where a button does not show in time, every element
      # of the window is printed.
      - name: Press the old window's update button
        if: matrix.window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [System.Windows.Automation.AutomationElement]
          function Put([string]$line) { [IO.File]::AppendAllText($env:GITHUB_ENV, "$line`n") }

          $started = Get-Date
          Put "RUN_STARTED=$($started.ToUniversalTime().ToString('o'))"
          $info = New-Object System.Diagnostics.ProcessStartInfo $env:WINDOW_EXE
          $info.UseShellExecute = $false
          $info.EnvironmentVariables['INSTALLERCLEAN_DEBUG_PRETEND_LATEST'] = "v$env:NEWER_VERSION"
          $info.EnvironmentVariables['INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST'] = $env:UPDATE_MANIFEST
          $info.EnvironmentVariables['INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD'] = (Resolve-Path 'publish/window/InstallerClean.exe').Path
          $info.EnvironmentVariables['INSTALLERCLEAN_DEBUG_PRETEND_COPY'] = '${{ matrix.copy }}'
          $old = [System.Diagnostics.Process]::Start($info)
          Put "OLD_PID=$($old.Id)"
          "  started the old window, process $($old.Id)"

          # The element of the old window with this AutomationId, or null.
          function Find([string]$id) {
            $mine = New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $old.Id)
            $named = New-Object System.Windows.Automation.PropertyCondition($A::AutomationIdProperty, $id)
            foreach ($window in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $mine)) {
              $found = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $named)
              if ($found) { return $found }
            }
            $null
          }
          # Whether the element can be pressed: enabled and on screen. An element that has
          # left the tree since it was found cannot.
          function Pressable($e) {
            if (-not $e) { return $false }
            try { $e.Current.IsEnabled -and -not $e.Current.IsOffscreen } catch { $false }
          }
          function State([string]$id) {
            $e = Find $id
            if (-not $e) { return "  ${id}: not in the window's tree" }
            try { "  ${id}: '$($e.Current.Name)', $(if ($e.Current.IsEnabled) { 'enabled' } else { 'disabled' }), $(if ($e.Current.IsOffscreen) { 'off screen' } else { 'on screen' })" }
            catch { "  ${id}: left the window's tree as it was read" }
          }
          # Prints every element of the old window, ends it and fails the step.
          function Stop-Leg([string]$message) {
            if ($old.HasExited) { "::error::$message The old window ended with exit code $($old.ExitCode)." }
            else { "::error::$message" }
            $mine = New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $old.Id)
            foreach ($window in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $mine)) {
              foreach ($e in $window.FindAll([System.Windows.Automation.TreeScope]::Subtree, [System.Windows.Automation.Condition]::TrueCondition)) {
                $c = $e.Current
                "  $($c.ControlType.ProgrammaticName)  id '$($c.AutomationId)'  name '$($c.Name)'$(if (-not $c.IsEnabled) { '  (disabled)' })$(if ($c.IsOffscreen) { '  (off screen)' })"
              }
            }
            if (-not $old.HasExited) { $old.Kill() }
            exit 1
          }
          # Waits until the button can be pressed and presses it.
          function Press([string]$id, [datetime]$deadline) {
            $button = $null
            while ((Get-Date) -lt $deadline -and -not $old.HasExited) {
              $button = Find $id
              if (Pressable $button) { break }
              $button = $null
              Start-Sleep -Seconds 1
            }
            if (-not $button) { Stop-Leg "$id did not show, enabled and on screen, by $($deadline.ToString('HH:mm:ss'))." }
            "  pressing $id, '$($button.Current.Name)', $([int]((Get-Date) - $started).TotalSeconds) s after the start"
            $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }

          if ('${{ matrix.button }}' -eq 'notice') {
            $deadline = $started.AddSeconds(300)
            while (-not (Pressable (Find 'UpdateOfferContinueButton')) -and (Get-Date) -lt $deadline -and -not $old.HasExited) { Start-Sleep -Seconds 1 }
            "While the card is up:"
            State 'UpdateOfferUpdateNowButton'
            State 'UpdateNowButton'
            Press 'UpdateOfferContinueButton' $deadline
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            while ((Pressable (Find 'UpdateOfferUpdateNowButton')) -and $clock.Elapsed.TotalSeconds -lt 30) { Start-Sleep -Milliseconds 500 }
            "Once the card has gone:"
            State 'UpdateOfferUpdateNowButton'
            State 'UpdateNowButton'
            if (Pressable (Find 'UpdateOfferUpdateNowButton')) { Stop-Leg "The card's Update now is still on screen 30 s after Continue without updating was pressed." }
            Press 'UpdateNowButton' (Get-Date).AddSeconds(120)
          } else {
            Press 'UpdateOfferUpdateNowButton' $started.AddSeconds(300)
          }
          Put "PRESSED=1"
          if (-not $old.WaitForExit(120000)) { "::error::The old window was still running 120 s after its update button was pressed."; exit 1 }
          "  the old window ended with exit code $($old.ExitCode)"

      # The newer exe the old window staged replaces it at its path once it has ended and
      # starts the copy there, which stays open. Each is waited for, then the checks read the
      # file at the path, what is left beside it, the kind of copy it decides it is, the
      # download folders, the crash log and the Application log.
      - name: Check the window's update
        if: ${{ !cancelled() && env.PRESSED == '1' }}
        shell: pwsh
        run: |
          . scripts/native-libraries.ps1
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }
          function Same($a, $b) {
            $a = $a -as [version]; $b = $b -as [version]
            $null -ne $a -and $null -ne $b -and
              $a.Major -eq $b.Major -and $a.Minor -eq $b.Minor -and [Math]::Max($a.Build, 0) -eq [Math]::Max($b.Build, 0)
          }
          $exe = $env:WINDOW_EXE
          $folder = Split-Path $exe
          $since = [datetime]::Parse($env:RUN_STARTED)

          $left = Wait-StagingProcesses 300 $since
          if ($left) { Fail "Still running 300 s after the old window ended: $($left -join ', ')" } else { '  nothing run from a staging folder is running' }

          "The newer window:"
          $newer = $null
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $newer -and $clock.Elapsed.TotalSeconds -lt 120) {
            # By its path: a process is named for its file, which here is the portable's or the slim's.
            $newer = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and [string]::Equals($_.Path, $exe, 'OrdinalIgnoreCase') } | Select-Object -First 1
            if (-not $newer) { Start-Sleep -Seconds 1 }
          }
          if ($newer) { "  process $($newer.Id) runs from $exe" } else { Fail "No InstallerClean runs from $exe 120 s after the staged exe ended." }

          "The file at the path:"
          $v = (Get-Item $exe).VersionInfo.FileVersion
          if (Same $v $env:NEWER_VERSION) { "  $exe carries $v" } else { Fail "$exe carries $v, not $env:NEWER_VERSION." }
          foreach ($file in Get-ChildItem -LiteralPath $folder -File) {
            if ($file.FullName -eq $exe) { continue }
            Fail "$($file.FullName) is beside the updated window."
          }
          foreach ($suffix in @(Get-ReplaceSuffixes) + '.old', '.new') {
            if (Test-Path -LiteralPath "$exe$suffix") { Fail "$exe$suffix is still there." }
          }

          # The kind of copy the newer window takes itself for goes into every report it writes.
          # It writes one only for the PC's first finished run, and a scan writes it only
          # from the card for a scan that offers nothing, so on a runner whose scan offers
          # files no report is written. Where there is one its kind is printed.
          "The newer window's report:"
          $report = Join-Path $env:LOCALAPPDATA 'InstallerClean\last-run.json'
          $clock.Restart()
          while (-not (Test-Path -LiteralPath $report) -and $newer -and -not $newer.HasExited -and $clock.Elapsed.TotalSeconds -lt 120) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath $report) {
            "  $report names the copy kind '$((Get-Content -Raw -LiteralPath $report | ConvertFrom-Json).app.copyKind)'"
          } else { "  no $report within 120 s of the newer window's start" }

          # The kind the updated file's own code decides for its path, read through the same
          # AppCopy.Decide the running window calls, with this runner's setup record and its
          # Scoop check. The merged exe is its own entry assembly when it runs, which is what
          # makes it a one-file build, so that answer is given as true. A copy in a folder
          # of its own is the portable, whichever name it has.
          "The kind of copy the updated file decides it is:"
          $probe = Join-Path $env:RUNNER_TEMP 'copy-kind'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Set-Content -Path (Join-Path $probe 'CopyKind.csproj') -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net48</TargetFramework>
              <PlatformTarget>x64</PlatformTarget>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $probe 'Program.cs') -Value @'
          using System;
          using System.IO;
          using System.Reflection;

          // args[0]: the updated window. Prints the kind AppCopy.Decide answers for its folder.
          static class Program
          {
              const BindingFlags All = BindingFlags.Public | BindingFlags.NonPublic | BindingFlags.Static | BindingFlags.Instance;

              static int Main(string[] args)
              {
                  var exe = Assembly.LoadFrom(args[0]);
                  var appCopy = exe.GetType("InstallerClean.Services.AppCopy", true);
                  var registry = Activator.CreateInstance(exe.GetType("InstallerClean.Services.RegistryReader", true), nonPublic: true);
                  var setup = appCopy.GetMethod("ReadSetupRecord", All).Invoke(null, new[] { registry });
                  var exists = exe.GetType("System.IO.FrameworkFile", true).GetMethod("Exists", All);
                  var fileExists = (Func<string, bool>)Delegate.CreateDelegate(typeof(Func<string, bool>), exists);
                  var kind = appCopy.GetMethod("Decide", All).Invoke(null, new object[] { true, Path.GetDirectoryName(args[0]), setup, fileExists });
                  Console.WriteLine("setup record " + setup + ", kind " + kind);
                  return 0;
              }
          }
          '@
          $build = dotnet build (Join-Path $probe 'CopyKind.csproj') -c Release --nologo -o (Join-Path $probe 'out') 2>&1
          if ($LASTEXITCODE -ne 0) { $build | Write-Host; Fail 'The copy kind harness did not build.' }
          else {
            $answer = & (Join-Path $probe 'out/CopyKind.exe') $exe
            "  $answer"
            if ($LASTEXITCODE -ne 0 -or "$answer" -notmatch ', kind Portable$') { Fail "The updated file does not decide it is the portable: $answer" }
          }

          if ($newer -and -not $newer.HasExited) { "NEWER_PID=$($newer.Id)" | Add-Content $env:GITHUB_ENV }

          "The download folders:"
          $staging = @(Get-ChildItem $env:ProgramData -Directory -Filter "$(Split-Path (Get-StagingPrefix) -Leaf)*" -ErrorAction SilentlyContinue)
          if ($staging) { Fail "Download folders are left under ${env:ProgramData} after the newer window started: $($staging.Name -join ', ')" } else { "  no download folder under $env:ProgramData" }

          "The crash log:"
          foreach ($log in (Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean\crash.log')) {
            if (-not (Test-Path $log)) { "  no $log"; continue }
            "  $log holds:"
            Get-Content $log | ForEach-Object { "    $_" }
            foreach ($pattern in 'Could not load file or assembly', 'UpdateFailedException') {
              foreach ($h in @(Select-String -Path $log -SimpleMatch $pattern)) { Fail "$log line $($h.LineNumber): $($h.Line.Trim())" }
            }
          }

          # Neither window writes an Application log entry for an update that worked. The one
          # entry a window update can write is the newer exe's, where nothing was at the path
          # once the old window had ended. An entry needs the InstallerClean event source,
          # and Get-WinEvent refuses a source that is not registered, so the registration is
          # read first: where no log has the source, no entry was written.
          "The Application log:"
          $sources = @(Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog' -ErrorAction Stop |
                       Where-Object { Test-Path -LiteralPath (Join-Path $_.PSPath 'InstallerClean') } | ForEach-Object PSChildName)
          if (-not $sources) { "  no event log has the InstallerClean source, so nothing wrote an entry" }
          else {
            "  the InstallerClean source is registered in the $($sources -join ', ') log"
            foreach ($logName in $sources) {
              try {
                $entries = @(Get-WinEvent -FilterHashtable @{ LogName = $logName; ProviderName = 'InstallerClean'; StartTime = $since.ToLocalTime() } -ErrorAction Stop)
              } catch {
                if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { Fail "The $logName log could not be read: $($_.Exception.Message)"; continue }
                $entries = @()
              }
              if (-not $entries) { "  no $logName entry from InstallerClean since the old window started" }
              foreach ($entry in $entries | Sort-Object TimeCreated) { Fail "$logName entry $($entry.Id) from InstallerClean at $($entry.TimeCreated.ToUniversalTime().ToString('HH:mm:ss.fff')) UTC: $($entry.Message)" }
            }
          }

          if ($failures.Count -gt 0) {
            "$($failures.Count) checks failed:"
            $failures | ForEach-Object { "  $_" }
            exit 1
          }
          'Every check passed.'

      # What the newer window shows, read through UI Automation in Windows PowerShell, then
      # the window is closed.
      - name: Print the newer window and close it
        if: ${{ !cancelled() && env.NEWER_PID != '' }}
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [System.Windows.Automation.AutomationElement]
          $newer = Get-Process -Id ([int]$env:NEWER_PID) -ErrorAction SilentlyContinue
          if (-not $newer) { "  the newer window had already ended"; exit 0 }
          $mine = New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $newer.Id)
          foreach ($window in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $mine)) {
            "  window '$($window.Current.Name)':"
            foreach ($e in $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              $c = $e.Current
              if ($c.IsOffscreen -or -not $c.Name) { continue }
              "    $($c.ControlType.ProgrammaticName)  id '$($c.AutomationId)'  name '$($c.Name)'"
            }
          }
          $null = $newer.CloseMainWindow()
          if (-not $newer.WaitForExit(30000)) { $newer.Kill(); '  the newer window did not close in 30 s and was ended' }
          else { '  the newer window closed' }

      # What the update left, read before the checks make their second run,
      # which changes it. This explains a result and decides none, so it runs
      # whatever happened and never fails the job.
      #
      # Every file beside the exe is described with the newer command line, so a
      # file that is not the newer version's shows by its hash, and so is
      # every file in a staging folder under %ProgramData%, which is what the
      # newer version ran from. On the setup's copy the Security log gives every
      # process start and exit and the Application log its entries, each to the
      # millisecond.
      - name: Describe what the update left
        if: always() && env.EXE != ''
        continue-on-error: true
        shell: pwsh
        run: |
          function Stamp([datetime]$t) { $t.ToUniversalTime().ToString('HH:mm:ss.fff') }
          function Describe([string]$path) {
            $item = Get-Item -LiteralPath $path
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            "  $path"
            "    FileVersion $($info.FileVersion), ProductVersion $($info.ProductVersion)"
            "    $($item.Length) bytes, last written $(Stamp $item.LastWriteTime) UTC"
            "    SHA-256 $((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $exe = $env:EXE
          $folder = Split-Path $exe
          $since = [datetime]::Parse($env:RUN_STARTED).ToUniversalTime()
          "The update run started at $(Stamp $since) UTC."

          "The command line's files beside the exe, read at $(Stamp (Get-Date)) UTC:"
          Get-ChildItem -LiteralPath $folder -Filter 'installerclean-cli.exe*' | ForEach-Object { Describe $_.FullName }

          "The files in the staging folders under $env:ProgramData`:"
          . scripts/native-libraries.ps1
          Get-ChildItem -LiteralPath $env:ProgramData -Directory -Filter "$(Split-Path (Get-StagingPrefix) -Leaf)*" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -File } | ForEach-Object { Describe $_.FullName }

          "The newer command line the old copy was given:"
          Describe (Resolve-Path 'publish/cli/installerclean-cli.exe').Path

          if ('${{ matrix.route }}' -ne 'setup') { return }

          "The Application log, source InstallerClean, from the update run on:"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean'; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue |
            Sort-Object TimeCreated | ForEach-Object { "  $(Stamp $_.TimeCreated)  $($_.Id)  $($_.Message)" }

          "Every process started or ended from the update run on, from the Security log:"
          Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4688, 4689; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue |
            Sort-Object TimeCreated | ForEach-Object {
              $data = @{}
              foreach ($d in ([xml]$_.ToXml()).Event.EventData.Data) { $data[$d.Name] = $d.'#text' }
              if ($_.Id -eq 4688) {
                "  $(Stamp $_.TimeCreated)  start  $($data.NewProcessName) pid $([Convert]::ToInt32($data.NewProcessId, 16)), started by $($data.ParentProcessName) pid $([Convert]::ToInt32($data.ProcessId, 16))"
              } else {
                "  $(Stamp $_.TimeCreated)  exit   $($data.ProcessName) pid $([Convert]::ToInt32($data.ProcessId, 16)), status $($data.Status)"
              }
            } | Where-Object { $_ -notmatch '\\(conhost|svchost|WmiPrvSE|backgroundTaskHost|RuntimeBroker|auditpol)\.exe' }

      # Every check runs and prints what it read, and the step fails if any of
      # them did. The lines the old copy prints are built from the Strings.resx
      # of the tag it was built from. The runner's UI language has no satellite,
      # so the old copy prints the neutral English.
      #
      # The crash log is not required to be empty: a scan writes entries of its
      # own for registrations it cannot read, on any machine. What fails is an
      # entry for an assembly that could not be loaded or for an update that
      # failed.
      #
      # The permissions are compared with a file the same account makes in the
      # same folder. On the command line's own download that file is the
      # update's own work, written into the folder; on the setup's copy the setup
      # writes it, so there the check reads what the setup leaves.
      - name: Check the result
        if: matrix.route == 'download' || matrix.route == 'setup'
        shell: pwsh
        run: |
          # For Get-ReplaceSuffixes and Get-StagingPrefix. Its Fail and its failures are
          # replaced here.
          . scripts/native-libraries.ps1
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }
          function Same($a, $b) {
            $a = $a -as [version]; $b = $b -as [version]
            $null -ne $a -and $null -ne $b -and
              $a.Major -eq $b.Major -and $a.Minor -eq $b.Minor -and [Math]::Max($a.Build, 0) -eq [Math]::Max($b.Build, 0)
          }

          . (Join-Path $env:RUNNER_TEMP 'run.ps1')

          $resx = [xml](Get-Content -Raw (Join-Path $env:OLD_TREE 'src/InstallerClean.Core/Resources/Strings.resx'))
          function Line([string]$name) {
            $value = ($resx.root.data | Where-Object name -eq $name).value
            if (-not $value) { throw "The old version's Strings.resx has no $name." }
            $value
          }

          $exe = $env:EXE
          $folder = Split-Path $exe
          $old = $env:OLD_VERSION
          $newer = $env:NEWER_VERSION

          $run = [pscustomobject]@{
            ExitCode = [int]$env:UPDATE_EXIT
            Output = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'update-run.txt')
          }

          $runningNewer = (Line 'Cli.UpdateRunningNewer') -f '/s', $newer
          $notRun = Line 'Cli.UpdateNotRun'
          $runningInstead = (Line 'Cli.UpdateRunningInstead') -f '/s', $old
          "The update to $newer, run by the newer version:"

          "The command line's output:"
          foreach ($expected in @(
              ((Line 'UpdateNotice.Available') -f $newer),
              ((Line 'UpdateNotice.Downloading') -f $newer),
              $runningNewer)) {
            if ($run.Output.Contains($expected)) { "  printed: $expected" } else { Fail "It did not print: $expected" }
          }
          foreach ($unexpected in @((Line 'UpdateNotice.DownloadFailed'), $notRun, $runningInstead)) {
            if ($run.Output.Contains($unexpected)) { Fail "It printed: $unexpected" } else { "  did not print: $unexpected" }
          }

          $stuck = Join-Path $env:RUNNER_TEMP 'update-stuck.txt'
          if (Test-Path -LiteralPath $stuck) { Fail (Get-Content -Raw -LiteralPath $stuck).Trim() }

          "The files:"
          $files = @($exe)
          if ('${{ matrix.route }}' -eq 'setup') { $files += Join-Path $folder 'InstallerClean.exe' }
          foreach ($f in $files) {
            $v = (Get-Item $f).VersionInfo.FileVersion
            if (Same $v $newer) { "  $f carries $v" } else { Fail "$f carries $v, not $newer." }
          }
          if ('${{ matrix.route }}' -eq 'setup') {
            $shown = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1').DisplayVersion
            if (Same $shown $newer) { "  the uninstall key's DisplayVersion is $shown" } else { Fail "The uninstall key's DisplayVersion is $shown, not $newer." }
          }
          foreach ($suffix in @(Get-ReplaceSuffixes) + '.old', '.new') {
            $left = "$exe$suffix"
            if (Test-Path -LiteralPath $left) { Fail "$left is still there." } else { "  no $left" }
          }

          "The permissions:"
          $control = Join-Path $folder 'permissions-control.tmp'
          Set-Content -Path $control -Value ''
          $made = (Get-Acl $control).GetSecurityDescriptorSddlForm('Access')
          Remove-Item $control
          $updated = (Get-Acl $exe).GetSecurityDescriptorSddlForm('Access')
          "  a file made in the folder: $made"
          "  the updated file:          $updated"
          if ($updated -ne $made) { Fail "$exe does not have the permissions a file made in its folder has." }

          "The Application log, source InstallerClean:"
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean' } -ErrorAction SilentlyContinue |
                      Sort-Object TimeCreated)
          foreach ($e in $events) { "  $($e.Id)  $($e.Message)" }
          $notInstalled = @($events | Where-Object Id -eq (Get-NothingAtPathEventId))
          $summaries = @($events | Where-Object { $_.Id -in 1000, 1002, 2000, 4000 })
          $unavailable = $run.Output.Contains((Line 'Cli.EventLogUnavailable'))
          $expectedId, $otherId = 3005, 3006
          $like = '*' + ((Line 'Cli.EventLogUpdated') -f '/s', $old, $newer, '/s') + '*'
          $expectedEntries = @($events | Where-Object Id -eq $expectedId)
          if ($expectedEntries.Count -ne 1) {
            Fail "$($expectedEntries.Count) entries with Event ID $expectedId, where one was expected$(if ($unavailable) { '; the run printed that the Application log refused its entries' })."
          } elseif ($expectedEntries[0].Message -notlike $like) {
            Fail "The $expectedId entry is not like '$like'."
          }
          $other = @($events | Where-Object Id -eq $otherId)
          if ($other) { Fail "$($other.Count) entries with Event ID $otherId." }
          if ($notInstalled) { Fail "$($notInstalled.Count) entries with Event ID $(Get-NothingAtPathEventId)." }
          # The run's own summary alone: a 4000 is the entry a version that refuses the switches
          # writes for them.
          $refusals = @($summaries | Where-Object Id -eq 4000)
          $own = @($summaries | Where-Object Id -ne 4000)
          if ($own.Count -ne 1) { Fail "$($own.Count) run summaries other than 4000, where the run's own was expected alone." }
          if ($refusals.Count) { Fail "$($refusals.Count) entries with Event ID 4000, where none was expected." }

          "The crash log:"
          $logs = @(
            (Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'),
            (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean\crash.log'))
          foreach ($log in $logs) {
            if (-not (Test-Path $log)) { "  no $log"; continue }
            "  $log holds:"
            Get-Content $log | ForEach-Object { "    $_" }
            $hits = @(foreach ($pattern in 'Could not load file or assembly', 'UpdateFailedException') { Select-String -Path $log -SimpleMatch $pattern })
            foreach ($h in $hits) { Fail "$log line $($h.LineNumber): $($h.Line.Trim())" }
          }

          "The exit code:"
          Write-Host "::group::A second run of the file now at the path"
          $again = Run $exe 0 @{} @('/s', '/noupdate')
          $again.Output
          "Exit code: $($again.ExitCode)"
          Write-Host "::endgroup::"
          "  the update run exited with $($run.ExitCode), the second run with $($again.ExitCode)"
          if ($run.ExitCode -ne 0) { Fail "The update run exited with $($run.ExitCode)." }
          if ($run.ExitCode -ne $again.ExitCode) { Fail "The update run's exit code is not that of the file now at the path." }

          # The staging folder stays until a copy's next start takes it away, which the second
          # run was.
          "The download folders:"
          $stagingFolders = @(Get-ChildItem $env:ProgramData -Directory -Filter "$(Split-Path (Get-StagingPrefix) -Leaf)*" -ErrorAction SilentlyContinue)
          if ($stagingFolders) { Fail "Download folders are left under ${env:ProgramData} after the second run: $($stagingFolders.Name -join ', ')" } else { "  no download folder under $env:ProgramData" }

          if ($failures.Count -gt 0) {
            "$($failures.Count) checks failed:"
            $failures | ForEach-Object { "  $_" }
            exit 1
          }
          'Every check passed.'

      # The newer setup, started on the setup's copy by the newer version once both
      # copies have ended, runs setup.tmp from an is-*.tmp folder Inno Setup's loader makes
      # in a temp folder. Each such folder the watch saw made is printed with its owner and its
      # permissions, and the step fails where it saw none, since the setup then did not
      # run as an update does.
      - name: Print the temp folders the newer setup made
        if: ${{ !cancelled() && matrix.route == 'setup' && env.UPDATE_PID != '' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'setup-temp.txt'
          . scripts/native-libraries.ps1
          "The is-*.tmp folders made in $((Get-TempFolders) -join ', ') by the newer setup (path, owner, permissions):"
          $made = @(Get-Content $out -ErrorAction SilentlyContinue | Where-Object { $_ })
          foreach ($line in $made) { "  $line" }
          if (-not $made) { "::error::The watch on the temp folders saw no is-*.tmp folder made, so the newer setup did not run."; exit 1 }
          # setup.tmp is the newer setup's own: the Security log, which audits each
          # process start on the setup's copy, has to show one starting from a folder the
          # watch saw made, each path compared in its long spelling.
          $folders = @($made | ForEach-Object { $path = ($_ -split "`t")[0]; $long = Get-FullPath $path; "$(if ($long) { $long } else { $path })".TrimEnd('\') + '\' })
          $since = [datetime]::Parse($env:RUN_STARTED)
          $starts = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4688; StartTime = $since.ToLocalTime() } -ErrorAction SilentlyContinue | ForEach-Object {
            $name = (([xml]$_.ToXml()).Event.EventData.Data | Where-Object Name -eq 'NewProcessName').'#text'
            $long = Get-FullPath $name
            if ($long) { $long } else { $name }
          } | Where-Object { $path = $_; @($folders | Where-Object { $path.StartsWith($_, 'OrdinalIgnoreCase') }).Count })
          foreach ($start in $starts) { "  started from one of them: $start" }
          if (-not $starts) { "::error::No process started from an is-*.tmp folder the watch saw made, so the folders printed are not shown to be the newer setup's."; exit 1 }

      # "Check the result" prints all of this itself, unless it stopped before its end.
      - name: Print the crash log and the Application log
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in (Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean\crash.log')) {
            if (Test-Path $log) { "$log holds:"; Get-Content $log } else { "No $log." }
          }
          # Get-WinEvent refuses a provider no entry has registered, whatever its error action,
          # which on a leg whose copy wrote no entry is the answer rather than a failure.
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean' } -ErrorAction Stop |
              Sort-Object TimeCreated | ForEach-Object { "$($_.Id)  $($_.Message)" }
          } catch {
            "No Application log entries from InstallerClean: $($_.Exception.Message)"
          }

      - name: Print the setup's log
        if: always() && matrix.route == 'setup'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'setup-install.log'
          if (Test-Path $log) { Get-Content $log } else { "No $log." }
