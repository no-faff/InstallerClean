name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write   # the relock job dispatches ci.yml and codeql.yml (workflow_dispatch)

jobs:
  # Dependabot's NuGet updater does not rewrite every packages.lock.json when it
  # moves a package that lives in InstallerClean.Core. Core is referenced by the
  # GUI, the CLI and the tests, and each of those projects' locks carries its own
  # copy of Core's dependency ranges, so a version inside Core forces all four
  # locks to move together. On the System.IO.Abstractions 22.1.1 -> 22.2.0 bump
  # (July 2026) it left the CLI's lock asserting Core still wanted [22.1.1, ) and
  # dropped a live System.Diagnostics.EventLog transitive entry from the GUI's;
  # CI restores with RestoreLockedMode, so the CLI build failed with NU1004.
  # Regenerating all four from the csproj files Dependabot edited is the fix, and
  # is a no-op on the bumps it already gets right (a package used by one project
  # only).
  #
  # Two things to know before touching this job.
  #
  # A commit pushed with the default GITHUB_TOKEN starts no workflow run of its
  # own (GitHub's anti-recursion rule), so nothing checks the head SHA this job
  # pushes and branch protection's required checks (build-and-test, Analyse C#)
  # would wait on it forever. The "Re-run the required checks" step below closes
  # that by dispatching ci.yml and codeql.yml: workflow_dispatch is the one event
  # the anti-recursion rule exempts, and a dispatched run's checks land on the
  # branch tip, which is the SHA the required checks are matched against. An
  # "Approve and run" click is a different mechanism (a first-time contributor's
  # fork PR held for a maintainer) and does not apply to a branch in this repo, so
  # it is not what unblocks this push. This is a reading of GitHub's documented
  # behaviour, and the one live firing tested only half of it: on PR #49
  # (750c680e, merged 2026-07-20) the relock step ran, committed and pushed, and
  # nothing in the repository records whether the dispatch step then fired. So the
  # push is proven and the path this paragraph describes is not.
  #
  # And Dependabot stops rebasing a PR once a commit it did not write lands on the
  # branch, so if such a PR later goes stale against main, close it and let
  # Dependabot raise a fresh one rather than waiting for a rebase.
  relock:
    if: |
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/nuget/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Linux with EnableWindowsTargeting, which is the shape the four committed
    # locks are in and the restore the owner's own machine performs. On
    # windows-2025, which this was, System.Diagnostics.EventLog resolves out of
    # the Desktop shared framework, so a regenerated lock can lose it and a
    # locked restore on Windows still passes over the gap that the same restore
    # on Linux fails as NU1004. Not hypothetical: the job's one live firing
    # dropped exactly that entry from the GUI's lock, and the whole
    # net10.0-windows7.0/win-x64 section with it (750c680e, PR #49; 1a049a76
    # restored it by hand). The runner that cannot see the damage was the one
    # writing the file.
    runs-on: ubuntu-latest
    concurrency:
      group: relock-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's branch, not the merge commit: the regenerated locks are
          # committed back to it. Dependabot's branches live in this repository,
          # so the checkout's default GITHUB_TOKEN credentials can push to them.
          ref: ${{ github.head_ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Regenerate the lock files
        run: dotnet restore src/InstallerClean.sln -p:EnableWindowsTargeting=true --force-evaluate

      - name: Commit any lock files Dependabot missed
        id: relock
        shell: bash
        run: |
          if git diff --quiet -- '*packages.lock.json'; then
            echo "All four lock files already agree with the bumped projects."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git commit -m 'chore(deps): regenerate the lock files for the bumped packages'
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Lock files regenerated and pushed; dispatching CI and CodeQL against the update branch so the required checks run on the new commit."

      # The push above lands a new head SHA that no pull_request run will ever
      # check: GitHub does not start a workflow run for a commit pushed with the
      # default GITHUB_TOKEN. workflow_dispatch is the documented exception, so
      # dispatching ci.yml and codeql.yml against the PR branch runs build-and-test
      # and Analyse C# on the branch tip, which is the SHA branch protection matches
      # the required checks against. Only needed when a commit was actually pushed;
      # if the locks already agreed, the original pull_request run still stands.
      - name: Re-run the required checks on the pushed commit
        if: steps.relock.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor bumps
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
