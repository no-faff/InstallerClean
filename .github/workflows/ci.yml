name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the Dependabot relock job re-run these checks on the commit it pushes: a
  # commit pushed with the default GITHUB_TOKEN starts no workflow run of its own
  # (GitHub's anti-recursion rule), and workflow_dispatch is the documented
  # exception. Also usable as a manual re-run from the Actions tab.
  workflow_dispatch:

# Read-only, declared rather than inherited from the repository default. Every
# step below only reads: two pinned actions, the node guards, dotnet, a
# Chocolatey install and ISCC. Nothing here pushes, comments or uploads an
# artefact, and a job that restores from nuget.org and installs a package from
# the Chocolatey community feed is the one place a build-time dependency could
# reach for whatever token the run is holding.
permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned rather than windows-latest so a GitHub image roll cannot redden an
    # unrelated push: that label moved from Server 2022 (VS2022) to Server 2025
    # (VS2026) on 2026-06-15, and an image change that breaks the build belongs
    # on a deliberate bump of this line rather than on GitHub's schedule.
    # windows-2022 is the fallback if the 2025 image regresses.
    runs-on: windows-2025

    steps:
      # fetch-depth: 0 for the superseded-English gate at the end of this job,
      # which compares every satellite value against every wording the neutral
      # resx has ever held, and so answers for exactly as much history as it is
      # given. The default fetch is one commit. That gate refuses to run in a
      # shallow clone rather than relying on this line, so removing the depth
      # turns the step red.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # EVERY STEP IN THIS JOB RUNS WHETHER OR NOT THE ONE BEFORE IT WENT RED, AND
      # THAT IS A DECISION RATHER THAN BOILERPLATE. Each guard below reads a
      # different part of the tree and none is a premise for any other: the resx
      # contract says nothing about XAML resource keys, and neither says anything
      # about whether the app builds. Without the condition the first red step
      # decides what the rest of the job is allowed to measure, so one guard going
      # red takes every verdict behind it with it and a run carrying several
      # faults reports one. A red step still fails the job. It just no longer
      # speaks for the steps it happens to stand in front of.

      # Source-level satellite contract: key presence, stray keys and {N}
      # placeholder arity across every Strings.<code>.resx. The compiled-
      # resource side is covered by SatelliteResxParityTests in the test run.
      - name: Check resx satellite parity
        if: success() || failure()
        run: node scripts/check-resx-parity.mjs

      # Strings.Designer.cs is hand-regenerated, so it can drift from the neutral
      # resx silently: an accessor whose key has been removed still compiles, and
      # Get() falls back to returning the key, so the first sign is a raw key on
      # screen.
      - name: Check Strings.Designer.cs is in step
        if: success() || failure()
        run: node scripts/check-designer-parity.mjs

      # Source-level drift guards, each pinned to a concrete failure the app has
      # actually hit: a resx key left with no consumer; the installer language
      # set and SupportedLanguages diverging when a language is added to one and
      # not the other. These need only the checkout, not the SDK, so they run
      # before it and report a source fault in seconds rather than after a build.
      - name: Check for dead resx keys
        if: success() || failure()
        run: node scripts/check-dead-resx-keys.mjs

      - name: Check installer language list
        if: success() || failure()
        run: node scripts/check-installer-languages.mjs

      # The two lists of counted strings, compared at the source because a
      # switch's arms are not enumerable at runtime. The script says why.
      - name: Check the counted-string inventory
        if: success() || failure()
        run: node scripts/check-counted-string-inventory.mjs

      # Directory.Build.props and the two app.manifest identities, checked here
      # rather than only at release time: the manifests are build inputs, so
      # after a release has built its binaries the fix costs a rebuild and every
      # hash it was scanned under.
      - name: Check version surfaces agree
        if: success() || failure()
        run: node scripts/check-version-surfaces.mjs

      # The level both hosts ask for decides what the scan concludes about a
      # per-user product it would not be entitled to see, so it is checked with
      # the other build inputs rather than left to whoever next opens a manifest.
      - name: Check both hosts ask for administrator
        if: success() || failure()
        run: node scripts/check-elevation-manifest.mjs

      # The window, the command line and the setup keep out of each other's way through
      # one mutex name, and the setup spells it in one #define, AppMutexName, where C#
      # cannot reach.
      - name: Check the single-instance mutex has one name
        if: success() || failure()
        run: node scripts/check-instance-lock-name.mjs

      # The window and the command line each start the newer setup with a switch of their
      # own, and Setup ignores a switch it does not know, so the spellings in C# and in the
      # setup's [Code] are held together here.
      - name: Check the setup reads each switch the app passes it
        if: success() || failure()
        run: node scripts/check-setup-switches.mjs

      # The setup renames each file it writes to {app} aside first and puts it back where
      # the install fails, and the app deletes what it held aside at the next start, so
      # the [Files] list, the HoldAside calls and the names in C# are held together here.
      - name: Check the setup holds aside every file it writes
        if: success() || failure()
        run: node scripts/check-setup-held-copies.mjs

      # Members of C# 14 extension blocks are called across the app's assemblies, and the
      # .NET 10 SDK's compiler binds one from another assembly only where it is public.
      - name: Check every member of an extension block is public
        if: success() || failure()
        run: node scripts/check-extension-member-access.mjs

      # Two guards read built files, so neither can be picked up with the
      # check-*.mjs glob that runs before the build. Each is invoked by name
      # instead, the artefact guard in both workflows and the native-imports
      # check in this one. This is what holds those lines in place.
      - name: Check the guards that read built files are still wired in
        if: success() || failure()
        run: node scripts/check-guard-wiring.mjs

      # A French value that lost its narrow no-break space to a plain space,
      # which plenty of editors do silently.
      - name: Lint French spacing
        if: success() || failure()
        run: node scripts/check-french-spacing.mjs

      # Program.cs prints each line of a Cli.Help.* value with Console.WriteLine and
      # wraps nothing, so a translated line over the console's column budget is torn
      # across two rows with the second hard against the left margin. It sits with
      # the source guards rather than with the gates at the end: a language over the
      # budget is a mistake in the string, not a translation still to be done.
      - name: Check CLI help fits its column budget
        if: success() || failure()
        run: node scripts/check-cli-help-width.mjs

      # The check above holds how wide a help line may be; this one holds where the
      # description column of the command rows starts. The column is per-language,
      # set by that language's longest installerclean-cli prefix, since a translated
      # metavariable is not the width of PATH, so each language is compared with
      # itself. A translation round that reflags some rows and leaves others
      # translated puts the two at different columns with every value correct read
      # on its own. A row still holding the neutral's English is left to
      # check-still-english rather than measured. It sits with the source guards for
      # the same reason as the width check.
      - name: Check CLI help columns line up
        if: success() || failure()
        run: node scripts/check-cli-help-alignment.mjs

      # Two faults with one trigger. A {StaticResource} whose key nothing defines,
      # and one whose resource is of a type the consuming property cannot take,
      # both compile clean and both throw when the template is first realised,
      # which is when a user opens that window. Neither the build nor the test
      # run below sees either, because resource lookup happens at neither.
      - name: Check XAML resource keys and types
        if: success() || failure()
        run: node scripts/check-xaml-resources.mjs

      # Text takes its font from the root it is drawn under, a window or a
      # tooltip or menu popup, and a root without the app's font draws a styled
      # TextBlock or a TextBox in the system font. Nothing fails when that
      # happens: the window opens and the line is in the wrong typeface.
      - name: Check every window and popup carries the app font
        if: success() || failure()
        run: node scripts/check-xaml-font.mjs

      # A character missing from the font a language is drawn in is drawn from
      # the next font in its list, in another typeface, and a bundled font with
      # other vertical metrics changes the height of every line drawn in it.
      # Nothing fails when either happens: the window opens with a word or a
      # line that does not match the rest. The fonts for Chinese, Japanese and
      # Korean are read from this runner's Windows Fonts folder.
      - name: Check every language's text is in the font it is drawn in
        if: success() || failure()
        run: node scripts/check-font-coverage.mjs

      # A production caller may pass the action services an empty set of claims and
      # the compiler cannot see it: the argument is required, so passing the wrong
      # value satisfies it. The under-lease re-read then returns a pass at its first
      # line without having asked anything. The tests below drive the call sites that
      # exist; this is what fails on the day somebody writes a new one.
      - name: Check the under-lease claims reach the action services
        if: success() || failure()
        run: node scripts/check-under-lease-claims.mjs

      # An Application-channel value is machine-read and is built in en-GB at the
      # write site, whatever the machine's language. This fails where a test
      # composes one outside MachineContract.English or MachineContract.WriteEventLog,
      # where it takes the language the test runs in. It prints every reference it
      # finds, in scope or not.
      - name: Check the tests compose machine-contract values in scope
        if: success() || failure()
        run: node scripts/check-machine-contract-scope.mjs

      # A Debug build reads switches a developer sets on their own PC, and a Release
      # build must not contain them. This fails where a switch's name, or a read of
      # the environment the script does not list, sits outside #if DEBUG; where a
      # project file, a response file or a workflow defines DEBUG outside the Debug
      # configuration; and where a publish in release.yml names a configuration other
      # than Release. It prints every name, read and definition it finds, and stops
      # where a switch's own name or read is not found.
      - name: Check the Debug-only switches stay out of Release builds
        if: success() || failure()
        run: node scripts/check-debug-only-switches.mjs

      # The update.json a release publishes is written by scripts/write-update-manifest.mjs
      # for the downloads the release uploads. This holds the writer's downloads and schema
      # to the ones UpdateManifest reads, the file it writes to the shape the app reads, and
      # the writer's own check to refusing a file that is not that.
      - name: Check the writer of a release's update.json agrees with the app
        if: success() || failure()
        run: node scripts/check-update-manifest.mjs

      # The files a copy downloads to update itself are named by AppCopy, and the
      # files release.yml publishes have to be those names. This holds the four places
      # release.yml names the downloads to the ones the app asks for.
      - name: Check the download names the release publishes are the ones the app asks for
        if: success() || failure()
        run: node scripts/check-download-names.mjs

      # Every step in this job carries the same condition, for the reason set
      # out at the first guard: no step here is a premise for any other, so a
      # red one reports its own verdict and decides nothing about the rest.
      - name: Setup .NET SDK
        if: success() || failure()
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet Audit runs during restore and reports a vulnerable package as a
      # warning; -warnaserror turns that into a failed step. `dotnet list package
      # --vulnerable` exits 0 while printing a high-severity advisory, so a step
      # built on it stays green on a vulnerable package. NuGetAuditMode=all is
      # explicit because an advisory can arrive through a transitive package as
      # well as a direct one.
      #
      # Keep this ahead of anything that restores. Restore is idempotent and
      # silent on a second call: after a build it prints "All projects are
      # up-to-date for restore" and emits no NU190x at all, so a step placed there
      # stays green over a graph nobody audited.
      - name: Fail on a vulnerable package
        if: success() || failure()
        run: dotnet restore src/InstallerClean.sln -p:RestoreLockedMode=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        if: success() || failure()
        run: dotnet build src/InstallerClean/InstallerClean.csproj -p:RestoreLockedMode=true

      - name: Build CLI
        if: success() || failure()
        run: dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -p:RestoreLockedMode=true

      # Each exe started for real, as the test host cannot be: on .NET Framework its module
      # initializer runs before the domain knows its target framework, and anything the
      # initializer writes to the crash log goes through System.IO there, which fixes the
      # runtime's compatibility defaults at .NET Framework 4.0 for the whole process. The
      # initializer keeps what it has to report and the exe writes it once Main runs, so a
      # start leaves no entry about the library search. This shows the search was not skipped
      # with a reason and not refused; whether it was set in a started exe is read on Windows
      # by hand, Windows having no call that reports it. The first-run mark is set first so
      # the window's scan carries no report.
      #
      # The window opens its main window only once its startup scan has finished, behind a
      # splash that WPF gives a hidden owner (ShowInTaskbar is off, in 3.7.0 as here), so
      # Process.MainWindowHandle, which takes only a visible window with no owner, finds
      # nothing until the main window. The step prints, for 3.7.0's release and for this
      # build, how long a command-line scan takes on this runner, and how long each window
      # takes to show its first window and its main window, so the time a user waits for the
      # window reads beside the scan's own cost and beside 3.7.0's. A scan by this build runs
      # first and is not timed, so every timed run reads the Installer folder from the same
      # warm cache. The step fails where this build's main window is not up within 120 s, or
      # comes up more than half as late again as 3.7.0's and more than 5 s after it. Where
      # 3.7.0's release does not download, the comparison is left out and said so.
      - name: Check each exe starts with nothing in the crash log about its library search
        if: success() || failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Name FirstRunRecorded -PropertyType DWord -Value 1 -Force | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'
          function Entries {
            if (-not (Test-Path $log)) { return @() }
            @(Get-Content $log | Where-Object { $_ -match 'library search|SetDefaultDllDirectories|SystemLibraries' })
          }
          $failed = $false

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class StartCheckWindows
          {
              private delegate bool EnumProc(IntPtr hwnd, IntPtr lParam);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumProc proc, IntPtr lParam);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hwnd);
              // Whether the process has any visible top-level window, owned or not.
              public static bool AnyVisible(int processId)
              {
                  var found = false;
                  EnumWindows((hwnd, _) =>
                  {
                      GetWindowThreadProcessId(hwnd, out var pid);
                      if (pid == (uint)processId && IsWindowVisible(hwnd)) { found = true; return false; }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@

          # A command-line scan, /s /noupdate, timed from start to exit.
          function Time-Scan([string]$label, [string]$exe) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList '/s', '/noupdate' -NoNewWindow -PassThru `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "$label-scan-out.txt") `
              -RedirectStandardError (Join-Path $env:RUNNER_TEMP "$label-scan-err.txt")
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) {
              Stop-Process -Id $p.Id -Force; $p.WaitForExit()
              "${label}: the command-line scan was still running after 120 s."
              return
            }
            "${label}: the command-line scan ended with $($p.ExitCode) after $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s."
          }

          # The window started, timed to its first visible window and to its main window,
          # then closed. Returns the seconds to the main window, or null where it did not
          # come up.
          function Time-Window([string]$label, [string]$exe) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -PassThru
            # Held so the exit code can be read if the window ends by itself.
            $null = $p.Handle
            $first = $null
            while ($clock.Elapsed.TotalSeconds -lt 120 -and -not $p.HasExited) {
              if ($null -eq $first -and [StartCheckWindows]::AnyVisible($p.Id)) { $first = $clock.Elapsed.TotalSeconds }
              $p.Refresh()
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 100
            }
            $firstText = if ($null -ne $first) { "$([math]::Round($first, 1)) s" } else { 'never' }
            $up = $null
            if ($p.HasExited) {
              Write-Host "${label}: the window exited by itself with $($p.ExitCode) before its main window was up (first window: $firstText)."
            } elseif ($p.MainWindowHandle -eq [IntPtr]::Zero) {
              Write-Host "${label}: no main window within 120 s (first window: $firstText)."
            } else {
              Write-Host "${label}: first window $firstText, main window $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s after the start: $($p.MainWindowTitle)"
              $up = $clock.Elapsed.TotalSeconds
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(10000) | Out-Null }
            return $up
          }

          $cli = 'src/InstallerClean.Cli/bin/Debug/net48/installerclean-cli.exe'
          if (-not (Test-Path $cli)) { throw "There is no $cli to start." }
          $window = 'src/InstallerClean/bin/Debug/net48/InstallerClean.exe'
          if (-not (Test-Path $window)) { throw "There is no $window to start." }

          $null = Time-Scan 'warm-up' $cli
          $released = Join-Path $env:RUNNER_TEMP 'release-3.7.0'
          gh release download v3.7.0 --repo $env:GITHUB_REPOSITORY --pattern installerclean-cli.exe --pattern InstallerClean-portable.exe --dir $released
          $haveRelease = $LASTEXITCODE -eq 0
          if (-not $haveRelease) { "3.7.0's release did not download, so nothing below is compared with it." }
          if ($haveRelease) { Time-Scan '3.7.0' (Join-Path $released 'installerclean-cli.exe') }
          Time-Scan 'this build' $cli
          $releasedUp = if ($haveRelease) { Time-Window '3.7.0' (Join-Path $released 'InstallerClean-portable.exe') } else { $null }

          $before = (Entries).Count
          $out = & $cli --version 2>&1
          "installerclean-cli --version exited $LASTEXITCODE and printed: $out"
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          $up = Time-Window 'this build' $window
          if ($null -eq $up) { $failed = $true }
          elseif ($null -ne $releasedUp -and $up -gt 1.5 * $releasedUp -and $up -gt $releasedUp + 5) {
            "This build's main window came up $([math]::Round($up, 1)) s after its start, against 3.7.0's $([math]::Round($releasedUp, 1)) s."
            $failed = $true
          }

          $new = @(Entries | Select-Object -Skip $before)
          foreach ($line in $new) { "crash.log: $line" }
          if ($new.Count -gt 0) { $failed = $true }
          if ($failed) { throw "An exe did not start cleanly, or wrote to the crash log about its library search." }
          "Both exes started, and neither wrote anything about its library search."

      # The tests set en-GB for themselves, culture and UI culture alike
      # (src/InstallerClean.Tests/AssemblyInfo.cs). This prints the runner's own
      # culture and UI culture, the two that setting takes the place of.
      - name: Print the runner's culture
        if: success() || failure()
        shell: pwsh
        run: |
          $culture = [System.Globalization.CultureInfo]::CurrentCulture
          $ui = [System.Globalization.CultureInfo]::CurrentUICulture
          "Culture:    $(if ($culture.Name) { $culture.Name } else { 'invariant' })"
          "UI culture: $(if ($ui.Name) { $ui.Name } else { 'invariant' })"

      # The normal console verbosity prints each test with its outcome, and each
      # skipped test with the reason it gives, which the default leaves out.
      - name: Test
        if: success() || failure()
        run: dotnet test src/InstallerClean.Tests/ -p:RestoreLockedMode=true --logger "console;verbosity=normal"

      # A build reports a broken reference in a documentation comment only when
      # it writes the documentation file, which no project here asks for. This
      # build asks for it and fails on every documentation warning except the
      # three that ask for more documentation: CS1591, CS1573 and CS1712. It
      # fails on CS1570 and CS1587 as well as on the reference warnings, because
      # the compiler resolves no reference inside a comment that is badly formed
      # or is not on a member, so a broken reference there shows up only as one
      # of those two. --no-incremental makes the compiler run whatever was built
      # before this step: an incremental build skips the compiler for a project
      # whose outputs are current, and a skipped compile reports nothing.
      - name: Check documentation comments
        if: success() || failure()
        run: dotnet build src/InstallerClean.sln --no-incremental -p:RestoreLockedMode=true -p:GenerateDocumentationFile=true -warnaserror:CS0419,CS1570,CS1571,CS1572,CS1574,CS1580,CS1581,CS1584,CS1587,CS1589,CS1590,CS1592,CS1658,CS1710,CS1711,CS1723,CS1734,CS1735,CS8018 -nowarn:CS1591,CS1573,CS1712

      # Everything from here to the setup compile depends on the BUILD having
      # succeeded, not on the tests having passed, and a red test run is precisely
      # when somebody wants to know that the downloads still publish and that the
      # .iss still compiles. Carrying no condition, all of them were skipped by a
      # red Test, which is how a reorder that put the language gates last still left
      # the .iss having never been compiled anywhere.
      # .NET Framework has no single-file publish, so each copy is one exe the
      # OneFile merge makes (Directory.Build.targets): a Release build of the
      # project with every assembly it references folded into the exe by ILRepack.
      # The window merge writes publish/window/InstallerClean.exe and the command
      # line's writes publish/cli/installerclean-cli.exe, each with its .exe.config
      # beside it, which is the shape the release builds and the shape the setup
      # embeds. There is one window exe: the portable and the slim download are
      # that same file under two names, so no separate framework-dependent build.
      - name: Merge the window into one file
        if: success() || failure()
        run: dotnet build src/InstallerClean/InstallerClean.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true

      - name: Merge the command line into one file
        if: success() || failure()
        run: dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true

      # The merge is the shipped shape, so these read it rather than the build
      # output: each exe's sha256 for the record, the target-framework attribute
      # ILRepack must keep (if it drops, 4.8 falls to its 4.0 compatibility
      # defaults and 30 path and other switches flip), and a clean start with
      # nothing in the crash log about the library search, which is the mark that
      # the exe is the image Windows started (SystemLibraries.IsProcessImage).
      - name: Check the merged exes carry 4.8 and start clean
        if: success() || failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'
          function SearchEntries { if (Test-Path $log) { @(Get-Content $log | Where-Object { $_ -match 'library search|SetDefaultDllDirectories|SystemLibraries' }) } else { @() } }
          $failed = $false
          foreach ($exe in 'publish/window/InstallerClean.exe', 'publish/cli/installerclean-cli.exe') {
            if (-not (Test-Path $exe)) { throw "The merge wrote no $exe." }
            $full = (Resolve-Path $exe).Path
            "sha256 $exe = $((Get-FileHash -Algorithm SHA256 $full).Hash)"
            $name = [System.Reflection.AssemblyName]::GetAssemblyName($full)
            # ILRepack keeps only the primary assembly's custom attributes, so the one
            # TargetFrameworkAttribute left is the window's or the command line's, and its
            # value string sits in the exe's metadata. The merged package assemblies
            # (net462, netstandard) are dropped, so ".NETFramework,Version=v4.8" is that
            # attribute and nothing else. A one-byte-per-char read finds it without loading
            # the assembly, which PowerShell 7 cannot do for a .NET Framework exe. The
            # read cannot tell that attribute from another UTF-8 copy of the same bytes (an
            # embedded resource, a merged assembly's own attribute that kept v4.8); it
            # holds today because no such copy exists and a C# string literal is UTF-16.
            $metadata = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($full))
            $carries48 = $metadata.Contains('.NETFramework,Version=v4.8')
            "$exe is $($name.Version), carries the 4.8 target-framework attribute: $carries48"
            if (-not $carries48) { "  the merge dropped the 4.8 target-framework attribute"; $failed = $true }
            # Environment.OSVersion reports Windows 10 or 11 only while the exe's manifest
            # carries the Windows 10 supportedOS entry; without it the report would say plain
            # "Windows". The merge keeps the primary exe's manifest, so this GUID (the Windows
            # 10 supportedOS Id in both app.manifest files) is in the exe's bytes, read the
            # same way and with the same limit as the attribute above.
            $win10Manifest = $metadata.Contains('8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a')
            "$exe carries the Windows 10 supportedOS manifest entry: $win10Manifest"
            if (-not $win10Manifest) { "  the merge dropped the Windows 10 supportedOS manifest entry"; $failed = $true }
          }
          # The command line is the one that starts without a window. A clean start
          # leaves no library-search line in the crash log.
          $before = (SearchEntries).Count
          $out = & 'publish/cli/installerclean-cli.exe' --version 2>&1
          "installerclean-cli --version exited $LASTEXITCODE and printed: $out"
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          $new = @(SearchEntries | Select-Object -Skip $before)
          foreach ($line in $new) { "crash.log: $line" }
          if ($new.Count -gt 0) { $failed = $true }
          if ($failed) { throw "A merged exe is not v4.8, did not start, or wrote to the crash log about its library search." }
          "Both merged exes carry 4.8, and the command line started clean."

      # A config beside a merged exe is accepted only where its text is the one the merge
      # writes (PlantedConfig). Each merged exe is copied into a folder of its own, where no
      # setup is recorded, and started four ways: alone, beside the config the merge wrote,
      # beside that config with a system.diagnostics section added, and beside the config
      # the window's build from source writes, whose binding redirects a merged exe does not
      # take. The first two start: the command line's scan exits 0 having printed it, and
      # the window's main window comes up. The other two refuse: the command line exits 1
      # having printed the refusal and no scan, and the window shows the refusal, whose
      # title carries the message, and exits 1 once it is closed, its main window never up.
      - name: Check a config beside a merged exe that the merge did not write refuses its start
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Name FirstRunRecorded -PropertyType DWord -Value 1 -Force | Out-Null
          $fromSource = 'src/InstallerClean/bin/Release/net48/InstallerClean.exe.config'
          if (-not (Test-Path $fromSource)) { throw "There is no $fromSource to plant." }
          if ((Get-Content -Raw $fromSource) -notmatch '<bindingRedirect ') { throw "$fromSource holds no binding redirect, so it plants nothing a merged exe refuses." }
          $failed = $false

          # The folder for one case: the exe copied in and, unless $config is null, that
          # text written beside it under the exe's name with .config after it.
          function Place([string]$exe, [string]$case, $config) {
            $dir = Join-Path $env:RUNNER_TEMP "planted-config/$(Split-Path -Leaf $exe)-$case"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item $exe $dir
            $copy = Join-Path $dir (Split-Path -Leaf $exe)
            if ($null -ne $config) { [IO.File]::WriteAllText("$copy.config", $config) }
            return $copy
          }

          foreach ($exe in 'publish/window/InstallerClean.exe', 'publish/cli/installerclean-cli.exe') {
            $own = [IO.File]::ReadAllText("$exe.config")
            if ($own -notmatch '</configuration>') { throw "$exe.config is not a config." }
            $cases = [ordered]@{
              'alone'           = @{ Config = $null; Starts = $true }
              'own-config'      = @{ Config = $own; Starts = $true }
              'added-section'   = @{ Config = $own.Replace('</configuration>', '<system.diagnostics><trace autoflush="true" /></system.diagnostics></configuration>'); Starts = $false }
              'redirects'       = @{ Config = [IO.File]::ReadAllText($fromSource); Starts = $false }
            }
            $name = Split-Path -Leaf $exe
            foreach ($case in $cases.Keys) {
              $copy = Place $exe $case $cases[$case].Config
              $starts = $cases[$case].Starts
              $label = "$name, $case"

              if ($name -eq 'installerclean-cli.exe') {
                $outFile = Join-Path $env:RUNNER_TEMP "planted-$case-out.txt"
                $errFile = Join-Path $env:RUNNER_TEMP "planted-$case-err.txt"
                $p = Start-Process -FilePath $copy -ArgumentList '/s', '/noupdate' -NoNewWindow -PassThru `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile
                $null = $p.Handle
                if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(); "${label}: still running after 120 s."; $failed = $true; continue }
                $out = Get-Content -Raw $outFile
                $err = Get-Content -Raw $errFile
                "${label}: exited $($p.ExitCode); stdout $($out.Length) chars; stderr: $err"
                $refused = $err -like "*won't start because there is a file called $name.config beside it*"
                if ($starts) {
                  if ($p.ExitCode -ne 0 -or $refused -or [string]::IsNullOrWhiteSpace($out)) { "  ${label}: expected a scan that exits 0 and no refusal."; $failed = $true }
                } else {
                  if ($p.ExitCode -ne 1 -or -not $refused -or -not [string]::IsNullOrEmpty($out)) { "  ${label}: expected exit 1, the refusal naming $name.config, and no scan output."; $failed = $true }
                }
                continue
              }

              # The window. Its main window is titled InstallerClean; the refusal's title is
              # its caption, "Startup error", then the message. The splash has a hidden
              # owner, so Process.MainWindowHandle never names it.
              $clock = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process -FilePath $copy -PassThru
              $null = $p.Handle
              $title = ''
              while ($clock.Elapsed.TotalSeconds -lt 120 -and -not $p.HasExited) {
                $p.Refresh()
                if ($p.MainWindowHandle -ne [IntPtr]::Zero -and $p.MainWindowTitle) { $title = $p.MainWindowTitle; break }
                Start-Sleep -Milliseconds 200
              }
              "${label}: after $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s its window reads: $title"
              $mainUp = $title -eq 'InstallerClean'
              $refused = $title -like "Startup error*won't start because there is a file called $name.config beside it*"
              if ($starts) {
                if (-not $mainUp) { "  ${label}: expected the main window."; $failed = $true }
                if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(10000) | Out-Null }
              } else {
                if (-not $refused) { "  ${label}: expected the refusal naming $name.config."; $failed = $true }
                if (-not $p.HasExited) { $null = $p.CloseMainWindow() }
                if (-not $p.WaitForExit(30000)) { "  ${label}: still running 30 s after the refusal was closed."; Stop-Process -Id $p.Id -Force; $p.WaitForExit(10000) | Out-Null; $failed = $true }
                elseif ($p.ExitCode -ne 1) { "  ${label}: exited $($p.ExitCode) once the refusal was closed, not 1."; $failed = $true }
                else { "  ${label}: exited 1 once the refusal was closed." }
              }
            }
          }
          if ($failed) { throw "A merged exe started beside a config the merge did not write, or refused one it did." }
          "Each merged exe starts alone and beside the config the merge wrote, and refuses beside any other."

      # .NET Framework reads a portable PDB beside an assembly for the file and line
      # in a stack trace. Whether it reads an EMBEDDED portable PDB, which is what a
      # Release build carries (Directory.Build.props, DebugType embedded) and so what
      # the merged exe carries, is the question crash.log's file and line numbers rest
      # on. This builds a net48 console with an embedded portable PDB outside the repo
      # tree, makes it throw across a frame, and fails unless the caught exception's
      # text carries ":line".
      - name: Check an embedded portable PDB gives a stack trace its line numbers
        if: success() || failure()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'linecheck'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net48</TargetFramework>
              <DebugType>embedded</DebugType>
              <Deterministic>true</Deterministic>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $dir 'LineCheck.csproj')
          @'
          using System;
          static class P {
            static void Deep() => throw new InvalidOperationException("line check");
            static int Main() {
              try { Deep(); } catch (Exception ex) {
                Console.WriteLine(ex.ToString());
                return ex.ToString().Contains(":line ") ? 0 : 3;
              }
              return 2;
            }
          }
          '@ | Set-Content (Join-Path $dir 'Program.cs')
          dotnet build (Join-Path $dir 'LineCheck.csproj') -c Release --nologo -o (Join-Path $dir 'out') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "The line-number probe did not build." }
          $out = & (Join-Path $dir 'out/LineCheck.exe') 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -eq 3) { throw "A 4.8 stack trace from an embedded portable PDB carries no :line, so crash.log would lose its file and line numbers." }
          if ($code -ne 0) { throw "The line-number probe exited $code." }
          "An embedded portable PDB gives a 4.8 stack trace its line numbers."

      # Reads each merged exe's own metadata and fails where the exe can load a library from
      # anywhere but System32 or .NET Framework's own folders: an assembly without the System32
      # library search, a P/Invoke outside InstallerClean.Interop.Native or naming a library
      # not on the list, an import or a call that loads a library by name or sets where one is
      # searched for and is not listed, a call that loads an assembly from a file or a name, a
      # reference to an assembly .NET Framework does not carry, or a module initializer whose
      # first call does not reach the call that sets the process's library search. The script
      # builds an assembly with each of those faults, which it has to report, and one without,
      # which it has to leave alone.
      - name: Check what the merged exes can load
        if: success() || failure()
        shell: pwsh
        run: ./scripts/check-native-imports.ps1

      # Here rather than with the other guards because it reads the two merged
      # exes, which do not exist until the steps above have run. A language that
      # never reaches an exe leaves the source resx present and correct, so every
      # guard that reads the tree passes and the window opens in English on a
      # machine set to that language.
      - name: Check the merged exes carry every language and ask for administrator
        if: success() || failure()
        run: node scripts/verify-shipped-artefacts.mjs

      # ISCC is the only thing that reads installer/*.iss, so a typo there shows
      # up nowhere else. Compiling the setup here finds it on the push that
      # caused it rather than on the release machine. The window and CLI merges
      # above put the exes and their .exe.config files exactly where the [Files]
      # section looks for them, in the shape the release script builds, so this
      # compiles the real setup rather than a stub. Repointing either at a
      # different publish directory quietly turns it back into one.
      #
      # The compile step fails on any warning ISCC prints, as well as on a
      # failed compile. A message missing from one language's .isl is a warning
      # and no more: the compile goes on, and that language's wizard shows the
      # text from another language in its place, English for a [Messages] entry
      # and the first language that defines it for a [CustomMessages] one. ISCC
      # prints each warning at the end of the compile as a line starting
      # "Warning: ", and writes no such line under /Q or /Qp, so either option
      # on the command line below lets a missing message through. Setting
      # MissingMessagesWarning=no in the script's [Setup] section does the same
      # for a [Messages] entry, by turning that warning off at the source.
      #
      # The version is pinned for the same reason the runner is: an Inno release
      # must not redden an unrelated push. 6.7.1 is the compiler that built the
      # shipped 2.0.x setups, and it is the one the bundled "Inno Setup 6.5.0+"
      # community .isl files are known to compile against. Bump it deliberately.
      # Conditioned with the compile below rather than left to the default: ISCC
      # is not on the runner image, so a compile step that runs past a red Test
      # while its installer step did not fails on a missing ISCC.exe and reports
      # nothing about the .iss.
      - name: Install Inno Setup
        if: success() || failure()
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Compile the installer
        if: success() || failure()
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Could not read <Version> from Directory.Build.props." }
          & $iscc "/DAppVersion=$version" installer\InstallerClean.iss | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = @($compileOutput | Where-Object { $_ -like 'Warning: *' })
          if ($warnings.Count -gt 0) {
            ''
            'ISCC printed these warnings, and any warning fails this step:'
            $warnings
            exit 1
          }

      # The seven language gates run last, and each runs even when one before it
      # has failed. Every one is named below, because a gate left out of the list
      # gets read as deliberate by default.
      #
      # FOUR HOLD THE SATELLITES IN STEP WITH THE ENGLISH, so each goes red when
      # a string in the neutral resx moves and the satellites, or the pages built
      # from them, have not yet followed: check-still-english, on a satellite
      # value that is still the English neutral; check-translation-freshness, on
      # a ledger entry recording a translation made against an English the
      # neutral has since replaced, or standing on a key the satellite or the
      # neutral no longer holds; the generator reproduction check, whose diff
      # catches a satellite the generators would now write differently and whose
      # TEMPLATE OK holds a template the reworded neutral has left behind; and
      # gen-translation-table --check, whose pages are generated from the resx.
      #
      # THREE ARE EXPECTED GREEN AT ALL TIMES and their red means a mistake:
      # check-accelerators, check-cross-key-rules and check-superseded-english.
      # The last reads the satellites too, but a satellite holding a wording the
      # English has ABANDONED is never a state a translation is on its way to
      # producing.
      #
      # They sit after the build and the test run, so a red language gate never
      # stops either of those from running. Each runs under !cancelled(), so one
      # red gate does not hide the ones after it, and unlike always() it stands
      # down on a cancelled job instead of posting a failure for every gate left.
      # Nothing is softened by the position: a failure here fails the job exactly
      # as one at the top does.

      # The premise every resx guard in this job rests on: each Strings.<code>.resx
      # is a byte-reproducible artefact of its generator in scripts/translations/.
      # All of them read the resx, so a value hand-edited there and not into its
      # generator passes every one and is reverted by whoever next runs the loop.
      # That has happened once. The generators are tracked now and CONTRIBUTING.md
      # sends translators straight at them.
      #
      # The diff holds reproducibility. TEMPLATE OK holds the template, which
      # writes no satellite for a diff to catch and which flag-retranslation.mjs
      # skips by name, so a reworded neutral leaves it holding the old English.
      # The satellites' own verdict lines are deliberately not read: they say
      # "still English (untranslated)" for every key awaiting a translation
      # round, which is what check-still-english below holds, and a generator's
      # exit code does not follow them. What it does follow is the parse control,
      # which stops the generator before it writes anything, so the loop below
      # keeps every generator's status rather than only the last one's.
      - name: Check every satellite reproduces from its generator
        if: '!cancelled()'
        shell: bash
        run: |
          # Each generator's status is kept as the loop goes. A command
          # substitution around the whole loop carries only the last one's, so
          # all but the last would have nowhere to report from.
          #
          # The check on them runs before the diff because a generator that stops
          # early leaves its satellite untouched, so the diff has nothing to say
          # about the one language that did not run.
          log=
          stopped=
          for g in scripts/translations/gen-strings-*.mjs; do
            out=$(node "$g") || stopped="$stopped $(basename "$g")"
            log="$log$out"$'\n'
          done
          echo "$log"
          if [ -n "$stopped" ]; then
            echo "Generators that did not finish:$stopped" >&2
            exit 1
          fi
          git diff --exit-code -- src/InstallerClean.Core/Resources
          # A case rather than a pipe into grep: the runner sets pipefail, and a
          # grep that exits on its first match can leave the echo feeding it
          # killed by SIGPIPE, which would fail this step over a log that said
          # the right thing.
          case "$log" in
            *"TEMPLATE OK"*) ;;
            *)
              echo "gen-strings-template.mjs did not report TEMPLATE OK; its output is above." >&2
              exit 1
              ;;
          esac
          # Each language's generator checks what it wrote and says GENERATION HAS ISSUES
          # where it finds a fault, such as a key in neither its translations nor its
          # stripped set, while still finishing.
          case "$log" in
            *"GENERATION HAS ISSUES"*)
              echo "A generator reported GENERATION HAS ISSUES; its output is above." >&2
              exit 1
              ;;
          esac

      - name: Check the access-key sets for a clash
        if: '!cancelled()'
        # Two controls live on one window at one moment must not share an Alt
        # access key: WPF answers a duplicate by cycling focus between the
        # matches instead of invoking either, so a clash silently retires BOTH,
        # in one language, on the route only a keyboard or screen-reader user
        # takes. An eye-verify pass runs in a single language and reads the
        # English accelerator, so nothing but this sees it.
        run: node scripts/check-accelerators.mjs

      # The rules that live BETWEEN two strings, or between a string and the
      # code that shows it: a spoken name against its visible label, a sentence
      # against the button it quotes, the installer-folder token, a window title
      # whose only consumer overwrites it. Every other check here holds one key's
      # structure or one key's sameness across files, so none of them can see a
      # rule of that shape, and the About window's tip button consequently
      # showed one phrase and spoke another in two languages across four
      # releases.
      #
      # A red naming a language is a fix in that language's generator under
      # scripts/translations/, never a hand-edit of the resx the message names.
      # Rules 7 and 8 fault the XAML and the C# instead and carry their own
      # instruction, which is what the script's closing footer is gated on.
      - name: Check cross-key rules
        if: '!cancelled()'
        run: node scripts/check-cross-key-rules.mjs

      # A required gate: a satellite shipping the English neutral for a
      # required key fails the build. Expected to fail on the commits between a
      # string's English landing and its translation round running, rather than
      # only on a mistake.
      - name: Check no satellite value is still the English
        if: '!cancelled()'
        run: node scripts/check-still-english.mjs

      # A different question from check-still-english's, and the two divide the
      # subject between them. That gate compares a satellite value against the
      # CURRENT neutral; this one compares it against every wording the neutral
      # has ever held, which is what identifies a value holding English the app
      # has since replaced. Comparing against a history means it answers for
      # exactly as much of one as it is given, so it needs the full fetch the
      # checkout at the top of this job asks for, and refuses to run without it.
      #
      # A hard gate rather than a translation-window one: a satellite holding a
      # wording the app has ABANDONED is not a state the translation pass is on
      # its way to producing. The script's own header sets out why that leaves it
      # with no false positives to trade against.
      - name: Check no satellite holds superseded English
        if: '!cancelled()'
        run: node scripts/check-superseded-english.mjs

      # The one thing about a translation nothing else asks: whether it has
      # fallen behind its English. Still-English fires when a satellite value
      # equals the CURRENT neutral, the gate above when it equals a FORMER one,
      # resx parity compares key presence and numeric placeholder arity, and
      # cross-key rules enforce named tokens. A satellite holding a TRANSLATION
      # of the previous English of a rewritten key matches nothing any of them
      # compares it against.
      #
      # IT ANSWERS FROM A LEDGER, so what it can say depends on what the ledger
      # carries. A key-slot the ledger holds is reported and fails the build once
      # the English has moved past it. So does an entry the English gives
      # nothing to measure against, such as one for a key taken out of it, and
      # so does one for a language with no satellite. A key-slot outside the
      # ledger is named in a NOTE line and is one the run makes no claim about.
      - name: Check translations against the freshness ledger
        if: '!cancelled()'
        run: node scripts/check-translation-freshness.mjs

      # docs/translations/*.md carry the same "generated, never hand-edited"
      # contract as the resx guards above. They are the pages the translation
      # feedback issue template and CONTRIBUTING.md point native speakers at, so
      # a stale one asks for corrections to text that no longer exists.
      - name: Check translation review tables are in step
        if: '!cancelled()'
        run: node scripts/gen-translation-table.mjs --check

  # The four packages.lock.json files are the project's only statement of what
  # is in the shipped binary closure, and every restore in the job above is
  # windows-2025, where System.Diagnostics.EventLog resolves out of the Desktop
  # shared framework whether the lock lists it or not. A lock that has lost it
  # therefore restores clean on Windows and fails NU1004 on Linux, so the job
  # above cannot see that gap and this restore is the one that can.
  #
  # A separate job rather than a step, because the one above is pinned to
  # windows-2025 and this has to run somewhere else. It reads the same locks
  # from the same checkout and writes nothing.
  #
  # It gates nothing on its own: branch protection requires build-and-test and
  # Analyse C# by name, so this has to be added there before a red one can stop
  # a merge. Until it is, the log is the whole of it.
  lock-files:
    name: Lock files (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore in locked mode
        run: dotnet restore src/InstallerClean.sln -p:EnableWindowsTargeting=true -p:RestoreLockedMode=true


  # Where each shipped exe loads the Windows libraries it uses from. The app runs
  # elevated, and a portable copy is often run from a Downloads folder, so a library
  # it would load from its own folder is one a file dropped there would replace. The two
  # exes are the merged builds release.yml makes: the window, which is also the portable
  # and the slim download under their own names, and the command line. Each is run in two
  # passes with Process Monitor recording every file its process opens or probes. The
  # command line runs twice in each pass: once to scan with /noupdate, and once to scan
  # after checking for updates, which reaches its network code.
  #
  # The first pass runs each exe from an empty folder of its own and notes every .dll it
  # looked for there and every library it loaded from Windows' own folders, System32,
  # WinSxS and the .NET Framework's. The second pass runs each exe again with a file of
  # each of those names planted beside it: for a look, the file the exe loaded under
  # that name in the first pass, else System32's, else, where no file on the runner
  # carries the name, a small System32 library under it; for a load, the copy it loaded.
  # An exe that searches System32 alone never looks beside itself for the second kind, so
  # that planting is the proof that it does not take them from there. The job fails where
  # an exe loaded, mapped or read a planted file, where no look found a planted file put
  # for a look, and where one had changed by the time the exe ended.
  #
  # In either pass the job also fails where an exe loaded a library from its own folder or
  # its working folder, or from anywhere outside Windows' own folders, Program Files and the
  # folder Windows Defender keeps under %ProgramData%. A look the exe makes is printed with
  # its full path, its place among the process's rows, and whether it came after the first
  # act of the exe's own code that Process Monitor can see. Each exe names that act: in the
  # command line, Main's look for the names a replace leaves beside the exe; in the window,
  # its look for the app's folder under %LOCALAPPDATA%. The first pass fails where an exe
  # shows another first, or none, and where an exe started with nothing planted writes to
  # its crash log.
  #
  # It refuses to pass on a run that saw nothing: Process Monitor has to have started
  # and recorded each exe's process, the command line has to have loaded msi.dll for its
  # scan, and the window has to have loaded dwmapi.dll and WPF's own graphics library,
  # which it does only once it creates a window, so a window that could not open on the
  # runner fails the job. The command line's run that checks for updates has to have had
  # an answer from github.com, and fails where the Application log shows it updated itself
  # or found a newer release it did not install.
  #
  # Then each exe is started with the switch a copy updating itself passes the newer
  # version, and the job fails where the exe does not say within 60 s that its own code is
  # running.
  #
  # A window started on a fresh account offers to send a report. Before any exe runs, the
  # PC-wide first-run mark is set, so the offer is never made, and the report receiver's
  # host is pointed nowhere in the hosts file. The job fails where either window left a
  # report behind.
  #
  # Last, the setup is compiled from the exes the job built and run from a folder of its
  # own under both passes, as a download is run. The setup, the setup.tmp it starts and
  # anything that starts are judged on the images they load from their own folders, and the
  # setup on the files planted beside it.
  #
  # Each pass's Process Monitor rows for every process named as one of the exes and for the
  # setup's processes and the app's crash logs are kept with the run for seven days,
  # whether or not the job passed.
  native-libraries:
    name: Native libraries (Windows)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the two exes as release.yml does
        run: |
          dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "The command line did not build." }
          dotnet build src/InstallerClean/InstallerClean.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "The window did not build." }

      # FirstRunRecorded under HKLM\SOFTWARE\NoFaff\InstallerClean is the mark a
      # window reads to decide this PC has run InstallerClean before, and with it set
      # no report is offered or saved. The hosts entry stops anything reaching the
      # receiver even so.
      #
      # The name is resolved before the entry is written and has to come back with a
      # real address, so the check after it is reading a resolver that answers. With
      # the entry in place the lookup passes where it returns no address other than
      # 0.0.0.0 and ::, or none at all, including as the HostNotFound or NoData that
      # GetHostAddresses throws for a name with no address. Any other address, or any
      # other error, fails the step.
      - name: Keep the windows from sending a report
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Name FirstRunRecorded -PropertyType DWord -Value 1 -Force | Out-Null
          $mark = (Get-ItemProperty 'HKLM:\SOFTWARE\NoFaff\InstallerClean').FirstRunRecorded
          if ($mark -ne 1) { throw "The first-run mark was not set." }

          $receiver = 'nofaff.netlify.app'
          $nowhere = '0.0.0.0', '::'
          try {
            $before = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            throw "The lookup of $receiver before the hosts entry is written failed: $($_.Exception.Message)"
          }
          if (-not @($before | Where-Object { $_ -notin $nowhere }).Count) {
            throw "$receiver resolves to $(if ($before.Count) { $before -join ', ' } else { 'no address' }) before the hosts entry is written."
          }

          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $entries = $nowhere | ForEach-Object { "$_ $receiver" }
          Add-Content -Path $hosts -Value ("`r`n" + ($entries -join "`r`n"))
          $written = @(Get-Content $hosts)
          foreach ($entry in $entries) {
            if ($written -notcontains $entry) { throw "The hosts file does not hold '$entry'." }
          }
          ipconfig /flushdns | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ipconfig /flushdns failed with $LASTEXITCODE, so the lookup below could read $receiver's address from before the hosts entry." }

          $lookupError = $null
          try {
            $after = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            $lookupError = $_.Exception
            while ($lookupError -and $lookupError -isnot [System.Net.Sockets.SocketException]) { $lookupError = $lookupError.InnerException }
            if (-not $lookupError) { throw "The lookup of $receiver with the hosts entry in place failed: $($_.Exception.Message)" }
            if ($lookupError.SocketErrorCode -notin 'HostNotFound', 'NoData') {
              throw "The lookup of $receiver with the hosts entry in place did not finish: $($lookupError.SocketErrorCode)."
            }
            $after = @()
          }
          $elsewhere = @($after | Where-Object { $_ -notin $nowhere })
          if ($elsewhere.Count) { throw "$receiver still resolves to $($elsewhere -join ', ') with the hosts entry in place." }
          $answer = if ($after.Count) { $after -join ', ' } elseif ($lookupError) { "no address ($($lookupError.SocketErrorCode))" } else { 'no address' }
          "  first-run mark set; $receiver resolved to $($before -join ', ') before the hosts entry and to $answer after it"

      # The steps after this one that record or judge a build dot-source native.ps1,
      # which defines the builds and then dot-sources scripts/native-libraries.ps1.
      - name: Get Process Monitor and name the builds the later steps run
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          $procmon = Get-Procmon (Join-Path $env:RUNNER_TEMP 'procmon')
          "PROCMON=$procmon" | Add-Content $env:GITHUB_ENV

          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'native.ps1') -Value @'
          $builds = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('/s', '/noupdate'); Wait = 60; MustLoad = @('msi.dll'); Marker = 'replace leftovers' },
            [pscustomobject]@{ Label = 'command line, checking for updates'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('/s'); Wait = 60; MustLoad = @('msi.dll', 'schannel.dll'); UpdateCheck = $true; Marker = 'replace leftovers' },
            [pscustomobject]@{ Label = 'window'; Exe = 'publish/window/InstallerClean.exe'; Arguments = @(); Wait = 20; MustLoad = @('dwmapi.dll', 'wpfgfx_v0400.dll'); Marker = 'app folder' }
          )
          # Each of the command line and the window started in replace mode
          # (Invoke-Replace in native-libraries.ps1), once putting itself in place and once
          # with nothing left at the path, given Wait seconds to end. A window that puts itself
          # in place starts the copy at the path, which the first pass judges as the
          # window it now is. A replace returns before the window or the scan starts, so it names
          # nothing it must load; its first act seen is judged instead.
          $builds += foreach ($base in @($builds | Where-Object Label -in 'command line', 'window')) {
            foreach ($mode in 'replaced', 'nothing') {
              [pscustomobject]@{
                Label = "$($base.Label), $(if ($mode -eq 'replaced') { 'putting itself in place' } else { 'with nothing left at the path' })"
                Exe = $base.Exe; Wait = 120; Marker = 'replaced copy'
                Replace = $mode; StartsAtPath = ($base.Label -ne 'command line'); AtPath = $base
              }
            }
          }
          # The command line started as an older copy's update starts it: running /s from the
          # staging folder standing for the copy at the path, in a working folder of its own
          # outside both, and then putting itself in place once that copy has ended
          # (Invoke-Replace's 'command'). Its looks in the working folder are judged like those
          # beside it, and the replace it starts is judged as a run of its own. The first act
          # seen of each is the look at the copy's file.
          $cli = $builds | Where-Object Label -eq 'command line'
          $builds += [pscustomobject]@{
            Label = 'command line, running /s from staging in a working folder of its own'
            Exe = $cli.Exe; Wait = 120; Marker = 'replaced copy'
            Replace = 'command'; StartsAtPath = $false; AtPath = $cli
          }

          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          '@

      # First the plants are worked out over records made up for the purpose, and the job
      # fails unless each look for a file to load beside an exe or in a working folder of
      # its own is planted for, each for data is not, each library loaded from Windows' own
      # folders is planted for under its name, a library from anywhere else is not, a load of a
      # planted file fails, a run that loads each library from System32 passes, and a look
      # recorded under a short name is read in full or fails (Test-ImageNameControls,
      # Test-WorkingFolderControls and Test-ShortNameControls in native-libraries.ps1). The
      # checks on how an exe in replace mode ended are run the same way over ends made up
      # with a fault planted in each, and must fail at each (Test-ReplaceControls), and so
      # are the check on where an image may be loaded from (Test-ImageFolderControls) and the
      # reading of each run's rows, and of the replace a run starts, from the lifetime of its
      # own process (Test-LifetimeControls).
      #
      # Each exe is also started in replace mode, as a newer version an update downloaded
      # is started to put itself at the old copy's path (Invoke-Replace): from a staging
      # folder under %ProgramData% made as the app makes one, against a stand-in old copy
      # it has to wait for, once putting itself in place and once with nothing left at the
      # path. What it looks for and loads there is judged like every other start, in both
      # passes. The job fails where it does not set the started event, ends with the wrong
      # exit code, leaves anything but the exe at the path or anything beside it, leaves
      # the exe without the access list a file made in that folder carries, writes the
      # Application-log entry saying the update was not installed where it put itself in
      # place, or does not write it where nothing was left. A window that puts itself
      # in place starts the copy at the path, which the first pass judges as that window
      # started from its own folder; the second pass ends it once the replace has ended.
      - name: First pass, with nothing planted
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          Test-ImageNameControls
          Test-WorkingFolderControls
          Test-ShortNameControls
          Test-LifetimeControls
          Test-ReplaceControls
          Test-ImageFolderControls
          "  interactive: $([Environment]::UserInteractive); session $((Get-Process -Id $PID).SessionId)"

          Start-Record 'first'
          $runs = foreach ($build in $builds) {
            if ($build.Replace) { Invoke-Replace $build $build.Label 'first' @() -JudgeCopy; continue }
            $folder = Get-RunFolder 'first' $build.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $started = Get-Date
            $id = Invoke-Build $build $build.Label $folder
            $ended = Get-Date
            [pscustomobject]@{ Label = $build.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id; Started = $started; Ended = $ended }
          }
          $read = Read-RecordWithReplaces (Stop-Record 'first') $runs
          $byProcess = $read.ByProcess
          $runs = $read.Runs

          $planned = [System.Collections.Generic.List[object]]::new()
          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            if (-not $run.Build.Replace) { Test-MustLoad $run $read.Loads }
            if ($run.Build.UpdateCheck) { Test-UpdateCheck $run $byProcess }
            # An exe whose first act seen is not the kind it names is judged against a later
            # row than its own code's start, so it fails rather than passing on that row.
            if (-not $read.Marker) { Fail "$($run.Label) showed no act of its own code." }
            elseif ($read.Marker.Kind -ne $run.Build.Marker) { Fail "$($run.Label)'s first act of its own code seen is the $($read.Marker.Kind) at row $($read.Marker.Index), where it should be the $($run.Build.Marker)." }
            Test-ImageFolders $run $read
            # Each exe writes to the crash log whatever fails as it starts, so an exe started
            # with nothing planted writes nothing there. The app also writes to it to add an
            # earlier folder's log to its own, which on a runner that never held an earlier
            # version is as wrong as an entry. A replace that finds nothing left at the path
            # writes why, which is printed.
            $crashLogPattern = '\\AppData\\Local\\(' + (($crashLogFolders | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')\\crash\.log$'
            $rows = $byProcess[(Get-RunKey $run)]
            $writes = @(for ($i = 0; $i -lt $rows.Count; $i++) {
              if ($rows[$i].Operation -eq 'WriteFile' -and $rows[$i].Path -match $crashLogPattern) { $i + 1 }
            })
            if ($writes -and $run.Build.Replace -eq 'nothing') { "  made $($writes.Count) WriteFile rows to its crash log, the first at row $($writes[0]), as a replace with nothing left at the path does" }
            elseif ($writes) { Fail "$($run.Label) made $($writes.Count) WriteFile rows to its crash log with nothing planted, the first at row $($writes[0]): $($rows[$writes[0] - 1].Path)." }
            foreach ($load in ($read.Loads | Where-Object Place -in 'own', 'working')) {
              $where = if ($load.Place -eq 'own') { 'its own folder' } else { 'its working folder' }
              Fail "$($run.Label) loaded $($load.Path) from $where, row $($load.Index), $(Get-When $load $read.Marker)."
            }

            # The copy a replace started at the path is planted for as well, in the folder the
            # replace puts the exe in, and judged against those plants in the second pass.
            if ($run.StartedCopy) {
              $starter = @($planned | Where-Object { $_.Label -eq $run.StartedBy.Label })
              if ($starter.Count -ne 1) { Fail "$($run.Label) has $($starter.Count) runs planned for the replace that started it, where it has one." }
              else { $starter[0].TargetPlants = @(Get-RunPlants $run $read) }
              continue
            }
            $plants = @(Get-RunPlants $run $read)
            # What an exe must load is among what is planted for it as a load, or the planting
            # would prove nothing about it.
            if (-not $run.Build.Replace) {
              foreach ($name in @($run.Build.MustLoad)) {
                if (-not @($plants | Where-Object { $_.Why -eq 'loaded' -and $_.Place -eq 'beside' -and $_.Path -eq $name })) { Fail "$($run.Label) loaded $name, which is not among the libraries planted for it as loaded from Windows' own folders." }
              }
            }
            # The replace a run starts is started again by that run in the second pass, so
            # its plants go with the run's, in the same staging folder, and are judged
            # against the replace.
            if ($run.StartedReplace) {
              $parent = @($planned | Where-Object { $_.BuildLabel -eq $run.Build.Label })
              if ($parent.Count -ne 1) { Fail "$($run.Label) has $($parent.Count) runs planned to start it, where it has one." }
              else { $parent[0].ReplacePlants = $plants }
            }
            else {
              $planned.Add([pscustomobject]@{ Label = $run.Label; BuildLabel = $run.Label; Plants = $plants; ReplacePlants = @(); TargetPlants = @() })
            }
          }

          "== Planted for the second pass"
          foreach ($p in $planned) {
            "  $($p.Label):"
            foreach ($plant in $p.Plants) { "    $($plant.Place) $($plant.Path): $($plant.Why), $($plant.Kind), $($plant.Source)" }
            foreach ($plant in $p.ReplacePlants) { "    for the replace it starts, $($plant.Place) $($plant.Path): $($plant.Why), $($plant.Kind), $($plant.Source)" }
            foreach ($plant in $p.TargetPlants) { "    in the folder the exe is put into, $($plant.Place) $($plant.Path): $($plant.Why), $($plant.Kind), $($plant.Source)" }
          }
          ConvertTo-Json -InputObject @($planned) -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'plants.json')

          # The exes write to the same crash logs in both passes, so a copy of each taken
          # now holds the first pass's entries alone. They go into the artifact.
          foreach ($folder in $crashLogFolders) {
            $crashLog = Join-Path $env:LOCALAPPDATA "$folder\crash.log"
            if (-not (Test-Path -LiteralPath $crashLog)) { continue }
            $kept = Join-Path $env:RUNNER_TEMP 'kept'
            New-Item -ItemType Directory -Force -Path $kept | Out-Null
            $name = if ($folder -eq 'InstallerClean') { 'crash-after-first-pass.log' } else { 'nofaff-crash-after-first-pass.log' }
            Copy-Item -LiteralPath $crashLog -Destination (Join-Path $kept $name)
            "  kept $crashLog as it stood after the first pass"
          }

          Exit-IfFailed

      # A planted file is judged by whether the exe loaded it, and a plant put for a look
      # counts only where a look found it in place and it was unchanged when the exe ended,
      # so a plant that was missed, removed or rewritten cannot pass.
      - name: Second pass, with the genuine files planted
        if: ${{ !cancelled() && env.PROCMON != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (-not (Test-Path $plantsFile)) { throw "The first pass wrote nothing to plant." }
          $planned = @(Get-Content -Raw $plantsFile | ConvertFrom-Json)

          Start-Record 'second'
          $runs = foreach ($p in $planned) {
            $build = $builds | Where-Object Label -eq $p.BuildLabel
            if ($build.Replace) {
              # A window that puts itself in place starts the copy at the path, which runs among
              # the plants put in the folder it is started in and is judged with them.
              Invoke-Replace $build $p.Label 'second' $p.Plants -replacePlants $p.ReplacePlants -targetPlants $p.TargetPlants -JudgeCopy:(@($p.TargetPlants).Count -gt 0)
              continue
            }
            $folder = Get-RunFolder 'second' $p.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $placed = @(Add-Plants $folder $p.Plants)
            $started = Get-Date
            $id = Invoke-Build $build $p.Label $folder
            $ended = Get-Date
            [pscustomobject]@{
              Label = $p.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id; Started = $started; Ended = $ended
              Placed = $placed
            }
          }
          $read = Read-RecordWithReplaces (Stop-Record 'second') $runs
          $byProcess = $read.ByProcess
          $runs = $read.Runs

          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            Test-PlantedRun $run $read
            Test-ImageFolders $run $read
            if (-not $run.Build.Replace) { Test-MustLoad $run $read.Loads }
            if ($run.Build.UpdateCheck) { Test-UpdateCheck $run $byProcess }
          }

          Exit-IfFailed

      # A copy updating itself starts the newer version with /startedevent:<id> and
      # puts itself back where that version has not set the event within 60 s. Every
      # build sets it once its own code is running: the command line as it takes its
      # arguments, a window once its splash is up and its services are built. So a build
      # that stops setting it is one no copy can update to. Each build is started here
      # from a folder of its own with the switch, and the step fails where the event is
      # not set within 60 s. The time each build took to set it is printed. The command
      # line is started for its version, so it scans nothing.
      #
      # A build given the switch that cannot set the event ends at once with exit code 1,
      # having run nothing, so the copy that started it puts itself back straight away.
      # Each build is started again with an id naming no event, the command line with /s so
      # that a build going on would scan, and the step fails where a build has not ended
      # within 60 s, ends with any other exit code, or, for the command line, prints anything.
      - name: Check each build says it has started
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          $failed = @()
          $builds = @(
            @{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('--version') },
            @{ Label = 'window'; Exe = 'publish/window/InstallerClean.exe'; Arguments = @() }
          )
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $signal = New-StartedEvent
            $started = $signal.Handle
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList (@($build.Arguments) + $signal.Argument) -WorkingDirectory $folder -PassThru
            # Read now, so the exit code is kept once the process ends.
            $null = $p.Handle
            $set = $started.WaitOne([TimeSpan]::FromSeconds(60))
            $clock.Stop()
            if ($set) { "  $($build.Label) set the event $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s after it was started" }
            else {
              $ended = if ($p.HasExited) { "; it ended with exit code $($p.ExitCode)" } else { '' }
              $failed += "$($build.Label) did not set the event within 60 s$ended."
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit() }
            $started.Dispose()
          }
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $id = [guid]::NewGuid().ToString('N')
            $isCli = $build.Label -eq 'command line'
            $arguments = @(if ($isCli) { '/s' }) + "$(Read-SourceString 'src/InstallerClean.Core/Helpers/HandOverContract.cs' 'StartedEventSwitch')$id"
            $output = Join-Path $folder 'no-event-output.txt'
            $errors = Join-Path $folder 'no-event-errors.txt'
            $p = if ($isCli) {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -NoNewWindow -PassThru `
                -RedirectStandardOutput $output -RedirectStandardError $errors
            } else {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -PassThru
            }
            $null = $p.Handle
            if (-not $p.WaitForExit(60000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit()
              $failed += "$($build.Label), given an event that does not exist, was still running after 60 s."
              continue
            }
            $printed = if ($isCli) { ((Get-Content -Raw $output) + (Get-Content -Raw $errors)) } else { '' }
            if ($p.ExitCode -ne 1) { $failed += "$($build.Label), given an event that does not exist, ended with exit code $($p.ExitCode), not 1." }
            elseif ($printed) { $failed += "$($build.Label), given an event that does not exist, printed: $printed" }
            else { "  $($build.Label), given an event that does not exist, ended with exit code 1 and printed nothing" }
          }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed.Count) { exit 1 }

      - name: Check no window left a report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $left = @()
          foreach ($folder in (Join-Path $env:LOCALAPPDATA 'InstallerClean'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean')) {
            $report = Join-Path $folder 'last-run.json'
            if (Test-Path $report) { $left += "A window left a report waiting: $report." } else { "  no $report" }
            $settings = Join-Path $folder 'settings.json'
            if ((Test-Path $settings) -and ((Get-Content -Raw $settings) -match '"reportToSend"\s*:\s*true')) {
              $left += "A window marked a report to send in $settings."
            }
          }
          $left | ForEach-Object { Write-Host "::error::$_" }
          if ($left.Count) { exit 1 }

      # The setup is compiled from the builds this job published, as build-and-test
      # compiles it, so it carries them.
      - name: Compile the setup
        if: ${{ !cancelled() && env.PROCMON != '' }}
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup did not install." }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Could not read <Version> from Directory.Build.props." }
          & $iscc "/DAppVersion=$version" installer\InstallerClean.iss | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $warnings = @($compileOutput | Where-Object { $_ -like 'Warning: *' })
          if ($warnings.Count -gt 0) { $warnings; throw "ISCC printed warnings, which fail the compile in build-and-test too." }
          "SETUP_VERSION=$version" | Add-Content $env:GITHUB_ENV

      # The setup is copied alone into a folder of its own, as a download sits in
      # Downloads, and run silently under Process Monitor, twice. A silent install starts
      # no window: the [Run] entry that opens the app needs /UPDATEFROMAPP and the other
      # is skipifsilent, so nothing here takes the single-instance mutex or writes a
      # report, and these runs come after every step that reads the app's own files.
      #
      # The setup exe is judged by its process ID and name: every look it makes for a DLL
      # in its own folder is printed, and the job fails where it loads an image from that
      # folder. Each process it starts, Inno Setup's setup.tmp from an is-*.tmp folder in a
      # temp folder (Get-TempFolders), and each process those start, is judged the same way against its own
      # folder, read from its own load of its image. An image in any is-*.tmp folder
      # passes only where the same process created it earlier in the record: such a folder
      # is made new with a new name on each run, and the owner and permissions of each are
      # printed as the setup made them. The job also fails where the
      # setup does not exit with 0, starts nothing from an is-*.tmp folder, or leaves no
      # uninstall entry whose DisplayVersion is the one built; the entry is removed before
      # each run, so the one read is that run's.
      #
      # The second run's folder holds the genuine file at every path the setup exe looked
      # at in its own folder in the first, and the job fails where the setup reads or
      # loads one, and where a plant was not looked for, not found, gone or changed.
      #
      # First the checks on the processes the setup starts are run over a record made up
      # for the purpose, and the job fails unless each fails exactly where it must
      # (Test-SetupControls in native-libraries.ps1).
      - name: Run the setup from its own folder, under both passes
        if: ${{ !cancelled() && env.PROCMON != '' && env.SETUP_VERSION != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          Test-SetupControls
          $setup = (Resolve-Path "publish/InstallerClean-$env:SETUP_VERSION-setup.exe").Path

          # Prints with Write-Host, so what it answers is the run and its reading alone.
          $uninstallKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1'

          function Invoke-Setup([string]$pass, $plants) {
            # The entry is removed first, so the one read after the run is this run's.
            Remove-Item -Path $uninstallKey -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path $uninstallKey) { throw "The uninstall entry could not be removed before the $pass pass." }
            $folder = Get-RunFolder $pass 'setup'
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item -LiteralPath $setup -Destination $folder
            $placed = @(Add-Plants $folder @($plants))
            $exe = Join-Path $folder (Split-Path $setup -Leaf)
            $out = Join-Path $env:RUNNER_TEMP "setup-$pass-temp.txt"
            $stop = Join-Path $env:RUNNER_TEMP "setup-$pass-temp.stop"
            $watch = Start-TempWatch $out $stop
            Start-Record "setup-$pass"
            try {
              $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -WorkingDirectory $folder -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(300000)) { $p.Kill($true); $p.WaitForExit(); Fail "The setup was still running after 300 s and was ended with every process it started." }
            }
            finally {
              Stop-TempWatch $watch $stop
              $csv = Stop-Record "setup-$pass"
            }
            Write-Host "  the setup, process $($p.Id), exited with $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Fail "The setup, $pass pass, exited with $($p.ExitCode)." }

            $run = [pscustomobject]@{ Label = "setup, $pass pass"; Build = [pscustomobject]@{ Exe = $setup }; Folder = $folder
              Exe = Split-Path $exe -Leaf; Id = $p.Id; Placed = $placed; TempFolders = @() }
            $kept = [System.Collections.Generic.List[string]]::new()
            $kept.Add("$($run.Id)`t$($run.Exe)")
            $byProcess = Read-Record $csv @($run)
            $read = Read-Run $run $byProcess
            if ($read) {
              $run.TempFolders = @(Test-OwnLoads $run $byProcess[(Get-RunKey $run)])
              if ($pass -eq 'second') { Test-PlantedRun $run $read }
              $started = @(Test-StartedProcesses $csv $run $byProcess[(Get-RunKey $run)] '')
              foreach ($child in $started) { $kept.Add("$($child.Id)`t$($child.Exe)") }
              Show-TempFolders $out (@($run) + $started)
            }
            Set-Content -Path (Join-Path $env:RUNNER_TEMP "kept-setup-$pass.txt") -Value $kept

            $shown = (Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue).DisplayVersion
            if ($shown -eq $env:SETUP_VERSION) { Write-Host "  the uninstall entry's DisplayVersion is $shown" }
            else { Fail "The uninstall entry's DisplayVersion is '$shown' after the $pass pass, not $env:SETUP_VERSION." }
            [pscustomobject]@{ Run = $run; Read = $read }
          }

          $first = Invoke-Setup 'first' @()
          $plants = @()
          if ($first.Read) {
            # Inno Setup's own loader is the setup's, so only the files it looked for beside itself
            # are planted for it.
            $plants = @(Get-RunPlants $first.Run $first.Read | Where-Object Why -eq 'looked')
            "== Planted for the setup's second pass"
            if (-not $plants) { '  none' }
            foreach ($plant in $plants) { "  $($plant.Place) $($plant.Path): $($plant.Why), $($plant.Kind), $($plant.Source)" }
          }
          $null = Invoke-Setup 'second' $plants
          Exit-IfFailed

      # A Process Monitor record holds every process on the runner, so only the rows of
      # the setup's processes, each by its process ID and name, and of every process
      # named as one of the exes or as a download is staged are kept, in the
      # record's order, each column as recorded. The log's row N for a process is its Nth
      # row in the file with that PID; its row N of the record is the record's own Nth row,
      # which this file does not number. Detail is emptied on a row that starts or creates
      # a process and must stay so, since the artifact is public. Each crash log the app keeps
      # is kept whole as the job leaves it, beside the first pass's copy of it: crash.log from
      # the app's folder, nofaff-crash.log from the NoFaff one. A run that ended before a record was saved keeps what there is, and this step
      # judges nothing. The artifact's name carries the run attempt, so a job run again
      # uploads under a name of its own.
      - name: Keep the Process Monitor rows
        if: ${{ always() }}
        shell: pwsh
        run: |
          $kept = Join-Path $env:RUNNER_TEMP 'kept'
          New-Item -ItemType Directory -Force -Path $kept | Out-Null
          $exes = 'installerclean-cli.exe', 'InstallerClean.exe', 'InstallerClean-portable.exe'
          foreach ($name in 'first', 'second') {
            $csv = Join-Path $env:RUNNER_TEMP "procmon\$name.csv"
            if (-not (Test-Path $csv)) { "  no $csv"; continue }
            $rows = @(Import-Csv $csv | Where-Object { $_.'Process Name' -in $exes } | ForEach-Object {
              if ($_.Operation -in 'Process Start', 'Process Create') { $_.Detail = '' }
              $_
            })
            $rows | Export-Csv -Path (Join-Path $kept "$name.csv") -NoTypeInformation -UseQuotes Always
            "  kept $($rows.Count) rows of $csv"
          }
          foreach ($name in 'setup-first', 'setup-second') {
            $csv = Join-Path $env:RUNNER_TEMP "procmon\$name.csv"
            $ids = Join-Path $env:RUNNER_TEMP "kept-$name.txt"
            if (-not (Test-Path $csv) -or -not (Test-Path $ids)) { "  no $name record to keep"; continue }
            $names = @{}
            foreach ($line in @(Get-Content $ids | Where-Object { $_ })) { $id, $exe = $line -split "`t"; $names[$id] = $exe }
            $rows = @(Import-Csv $csv | Where-Object { $names.ContainsKey($_.PID) -and $_.'Process Name' -eq $names[$_.PID] } | ForEach-Object {
              if ($_.Operation -in 'Process Start', 'Process Create') { $_.Detail = '' }
              $_
            })
            $rows | Export-Csv -Path (Join-Path $kept "$name.csv") -NoTypeInformation -UseQuotes Always
            "  kept $($rows.Count) rows of $csv, for the processes $(@($names.Keys) -join ', ')"
          }
          $native = Join-Path $env:RUNNER_TEMP 'native.ps1'
          if (Test-Path $native) { . $native } else { "  no $native, so the crash logs' folders are not known"; $crashLogFolders = @() }
          foreach ($folder in $crashLogFolders) {
            $crashLog = Join-Path $env:LOCALAPPDATA "$folder\crash.log"
            $name = if ($folder -eq 'InstallerClean') { 'crash.log' } else { 'nofaff-crash.log' }
            if (Test-Path -LiteralPath $crashLog) { Copy-Item -LiteralPath $crashLog -Destination (Join-Path $kept $name); "  kept $crashLog" }
            elseif ($folder -eq 'InstallerClean') { "  no $crashLog" }
          }

      - name: Upload the Process Monitor rows
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-monitor-records-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kept
          if-no-files-found: warn
          retention-days: 7

      # The command line's update starts the setup with /UPDATEFROMCLI among the switches
      # CommandLineUpdate.SetupArguments builds, and this step reads them from there. The
      # switch has Setup wait for every copy of the app to let the single-instance mutex go
      # before its own AppMutex check, and open nothing afterwards. A second PowerShell holds the mutex,
      # under the name the setup's AppMutexName define gives it, for a few seconds and
      # writes the moment it lets go. The setup started with the switch while it is held
      # must exit with 0 after that moment, with its log saying how long it waited, and
      # leave no InstallerClean.exe running from the installed folder. The look for that
      # process is shown able to see one: the setup started with the window's
      # /UPDATEFROMAPP, with the mutex free, must leave the app running from there.
      #
      # The control is a start without either switch, against a hold that outlasts it: the
      # setup must end while the mutex is still held, with neither a 0 exit nor the waited
      # line, and must not write the installed InstallerClean.exe. Setup gives every file
      # it writes the time stored in it, so the installed exe's time is set to one no
      # build carries first, and a write would put the stored one back. A control that
      # passed would mean the first run's wait is not the switch's doing.
      #
      # It runs after the Process Monitor rows and the crash logs are kept, since the
      # window it opens on purpose writes to the app's own folders before it is ended.
      - name: Run the setup with the command line's switch while the app's mutex is held
        if: ${{ !cancelled() && env.PROCMON != '' && env.SETUP_VERSION != '' }}
        shell: pwsh
        run: |
          $failed = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failed.Add($message); Write-Host "::error::$message" }
          $setup = (Resolve-Path "publish/InstallerClean-$env:SETUP_VERSION-setup.exe").Path
          $define = Select-String -LiteralPath installer/InstallerClean.iss -Pattern '^#define\s+AppMutexName\s+"([^"]+)"\s*$'
          if (@($define).Count -ne 1) { throw "installer/InstallerClean.iss has no single AppMutexName define." }
          $mutexName = $define.Matches[0].Groups[1].Value
          # The switches the command line starts the setup with, read from where it builds them.
          $built = Select-String -LiteralPath src/InstallerClean.Core/Services/CommandLineUpdate.cs -Pattern '^\s*"/VERYSILENT ([^"]+)";'
          if (@($built).Count -ne 1) { throw "CommandLineUpdate.SetupArguments' switches could not be read." }
          $cli = @($built.Matches[0].Groups[1].Value.Trim() -split '\s+')
          if ('/UPDATEFROMCLI' -notin $cli) { throw "CommandLineUpdate.SetupArguments does not pass /UPDATEFROMCLI: $($cli -join ' ')" }
          $withoutSwitch = @($cli | Where-Object { $_ -ne '/UPDATEFROMCLI' })
          Write-Host "  the command line's switches: /VERYSILENT $($cli -join ' ')"
          $uninstallKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1'
          $folder = (Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue).InstallLocation
          if (-not $folder) { throw "No install location in the uninstall entry; the setup step before this one did not install." }
          $installed = Join-Path $folder 'InstallerClean.exe'
          Write-Host "  mutex $mutexName; installed copy $installed"

          # Starts a PowerShell that holds the mutex for $seconds, writes the UTC moment it
          # lets go to $released just before it closes its handle, and answers the process
          # once the mutex is held.
          function Start-Holder([string]$label, [int]$seconds) {
            $ready = Join-Path $env:RUNNER_TEMP "holder-$label.ready"
            $released = Join-Path $env:RUNNER_TEMP "holder-$label.released"
            Remove-Item -LiteralPath $ready, $released -ErrorAction SilentlyContinue
            $script = Join-Path $env:RUNNER_TEMP "holder-$label.ps1"
            Set-Content -LiteralPath $script -Value @"
          `$m = [System.Threading.Mutex]::new(`$false, '$mutexName')
          `$null = `$m.WaitOne()
          Set-Content -LiteralPath '$ready' -Value 'held'
          Start-Sleep -Seconds $seconds
          [DateTime]::UtcNow.ToString('o') | Set-Content -LiteralPath '$released'
          `$m.ReleaseMutex()
          `$m.Dispose()
          "@
            $p = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-File', $script -PassThru
            $null = $p.Handle
            $until = [DateTime]::UtcNow.AddSeconds(30)
            while (-not (Test-Path -LiteralPath $ready) -and [DateTime]::UtcNow -lt $until) { Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path -LiteralPath $ready)) { $p.Kill(); throw "The $label holder did not hold the mutex within 30 s." }
            [pscustomobject]@{ Process = $p; Released = $released }
          }

          # Runs the setup with /VERYSILENT and $extra and answers its exit code,
          # the UTC moment it ended and its log.
          function Invoke-Setup([string]$label, [string[]]$extra) {
            $log = Join-Path $env:RUNNER_TEMP "setup-$label.log"
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
            $arguments = @('/VERYSILENT') + $extra + @("/LOG=`"$log`"")
            Write-Host "  setup $($arguments -join ' ')"
            $p = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill($true); $p.WaitForExit(); throw "The $label setup was still running after 300 s." }
            $ended = $p.ExitTime.ToUniversalTime()
            $text = if (Test-Path -LiteralPath $log) { Get-Content -Raw -LiteralPath $log } else { '' }
            Write-Host "  exited with $($p.ExitCode) at $($ended.ToString('o'))"
            [pscustomobject]@{ ExitCode = $p.ExitCode; Ended = $ended; Log = $text }
          }

          $waitedLine = 'Waited (\d+) ms for InstallerClean to close\.'

          "== With /UPDATEFROMCLI, the mutex held for 8 s"
          $holder = Start-Holder 'switch' 8
          try {
            $run = Invoke-Setup 'switch' $cli
            if (-not $holder.Process.WaitForExit(60000)) { Fail "The holder for the switch's run did not end." }
          }
          finally {
            if (-not $holder.Process.HasExited) { $holder.Process.Kill(); $holder.Process.WaitForExit() }
          }
          $released = if (Test-Path -LiteralPath $holder.Released) { [DateTime]::Parse((Get-Content -LiteralPath $holder.Released).Trim(), $null, 'RoundtripKind') }
          if (-not $released) { Fail "The holder for the switch's run wrote no moment it let go." }
          else {
            Write-Host "  the holder let go at $($released.ToString('o'))"
            if ($run.Ended -lt $released) { Fail "The setup started with /UPDATEFROMCLI ended before the mutex was let go." }
          }
          if ($run.ExitCode -ne 0) { Fail "The setup started with /UPDATEFROMCLI exited with $($run.ExitCode)." }
          $waited = [regex]::Match($run.Log, $waitedLine)
          if (-not $waited.Success) { Fail "The log of the setup started with /UPDATEFROMCLI has no line saying how long it waited." }
          else {
            Write-Host "  log: $($waited.Value)"
            if ([int]$waited.Groups[1].Value -lt 4000) { Fail "The setup started with /UPDATEFROMCLI waited $($waited.Groups[1].Value) ms, under the hold." }
          }
          $runLines = @($run.Log -split '\r?\n' | Where-Object { $_ -match 'Run entry|Filename:' })
          if ($runLines) { $runLines | ForEach-Object { Write-Host "  log: $_" } } else { Write-Host "  log: no [Run] entry named" }
          # The app running from the installed folder, looked for until $seconds have passed.
          function Find-Opened([int]$seconds) {
            $until = [DateTime]::UtcNow.AddSeconds($seconds)
            do {
              $opened = @(Get-Process -Name InstallerClean -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installed })
              if ($opened) { return $opened }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $until)
            @()
          }
          $opened = @(Find-Opened 30)
          if ($opened) { Fail "The setup started with /UPDATEFROMCLI opened the app (process $($opened.Id -join ', '))."; $opened | Stop-Process -Force }
          else { Write-Host "  no InstallerClean.exe running from $installed" }

          "== With /UPDATEFROMAPP, the mutex free: the look for the app must find it"
          $run = Invoke-Setup 'app' ($withoutSwitch + @('/UPDATEFROMAPP'))
          if ($run.ExitCode -ne 0) { Fail "The setup started with /UPDATEFROMAPP exited with $($run.ExitCode)." }
          $opened = @(Find-Opened 30)
          if (-not $opened) { Fail "The setup started with /UPDATEFROMAPP left no InstallerClean.exe running from $installed, so the look above cannot see one." }
          else {
            Write-Host "  InstallerClean.exe running from $installed, process $($opened.Id -join ', ')"
            $opened | Stop-Process -Force
            foreach ($app in $opened) {
              if (-not $app.WaitForExit(30000)) { Fail "The app the setup opened, process $($app.Id), was still running 30 s after it was ended." }
            }
          }

          "== Without either switch, the mutex held for 60 s"
          $planted = [DateTime]::new(2001, 1, 1, 0, 0, 0, [DateTimeKind]::Utc)
          (Get-Item -LiteralPath $installed).LastWriteTimeUtc = $planted
          $before = (Get-Item -LiteralPath $installed).LastWriteTimeUtc
          if ($before -ne $planted) { Fail "The installed exe's time could not be set to $($planted.ToString('o'))." }
          $holder = Start-Holder 'control' 60
          try {
            $run = Invoke-Setup 'control' $withoutSwitch
            if ($holder.Process.HasExited) { Fail "The control's holder had let go before the setup ended; the control proves nothing." }
          }
          finally {
            if (-not $holder.Process.HasExited) { $holder.Process.Kill(); $holder.Process.WaitForExit() }
          }
          if ($run.ExitCode -eq 0) { Fail "The setup without the switch exited with 0 with the mutex held." }
          if ($run.Log -match $waitedLine) { Fail "The setup without the switch waited for the mutex." }
          else { Write-Host "  log: no line saying it waited" }
          $after = (Get-Item -LiteralPath $installed).LastWriteTimeUtc
          if ($after -ne $before) { Fail "The setup without the switch wrote $installed with the mutex held (its time is $($after.ToString('o')))." }
          else { Write-Host "  $installed still carries the planted time $($after.ToString('o'))" }

          if ($failed.Count) { exit 1 }

  # The command line's own download, updating to a newer version, downloads it into a
  # staging folder under %ProgramData% and starts it there, in the same console, to run the
  # command standing for the copy at the path. It waits up to a minute for the newer
  # version to say its own code is running before it hands the run over, and the newer
  # version then puts itself at the path once both have ended. This job runs that in a
  # single-file build, offline, against three newer files.
  #
  # The old copy is the command line published as a single file from this commit with
  # the Debug configuration, so it reads INSTALLERCLEAN_DEBUG_PRETEND_LATEST, which has
  # its update check answer that v9.9.9 is the newest release without asking GitHub, and
  # INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD, which has its download fetch the named file in
  # place of the release's, and INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST, which has it read the
  # named file as the release's update.json. A release above 3.5.0 has to carry one, so
  # every run is given a file: the one scripts/write-update-manifest.mjs writes for all four
  # downloads, which the old copy reads as it reads a release's, or, in the three runs that
  # check the refusal, one with a schema it does not read, one requiring something it does
  # not know, and the writer's file for every download but the command line.
  # Those three print the line saying the newer version can't be installed automatically
  # and the release page, download nothing, leave the file at the path as it was, write
  # the one 3006 saying so and nothing to crash.log, and run the command with the old copy.
  # Everything after the download, the checks on the file, the start, the wait and the
  # replace, runs as it does in a release.
  #
  # The three newer files each carry the file version 9.9.9, which the old copy checks
  # before it starts anything:
  # - the command line published as a Release build stamped 9.9.9, which says it has
  #   started, runs the command and then starts its replace. The old copy starts it with
  #   /noupdate, so it makes no update check, and a Release build ignores the Debug
  #   switches it inherits with the old copy's environment;
  # - a stand-in that never says it has started and sleeps, which the old copy ends
  #   after 60 seconds before it runs the command itself;
  # - the same stand-in ending at once with exit code 7.
  # The stand-in is a console program built here, published as one self-contained file
  # named installerclean-cli.exe, the name the old copy downloads the newer command line
  # under. It writes its arguments to the file named by START_CHECK_STAND_IN_ARGUMENTS and
  # reads what to do from START_CHECK_STAND_IN.
  #
  # Each newer file is offered to a fresh copy of the old one in a folder of its own,
  # one after another, each run with /s and its input and output redirected, so nobody
  # can answer it, and bounded at 240 s. The job fails where:
  # - the old copy does not print what it should, or prints what it should not: the
  #   newer version running the command, where it said it had started; the newer
  #   version not run and the command run with the old version, where it did not;
  # - the Application log, read for up to 5 s after each run for the entries made since
  #   it started, does not hold one 3005 naming 9.9.9 where the newer
  #   version started, or one 3006 naming the newer version not run where it did not, or
  #   holds the other, or holds a 3007, which says a replace failed. The app registers
  #   its own event source, as it does on a PC. Where an entry is missing the step prints
  #   whether the run printed the note saying the Application log refused an entry, and
  #   the line crash.log carries saying why;
  # - a process is still running from a staging folder 120 s after the run ended, which
  #   is what the replace runs from;
  # - the file at the path does not carry the version that should be there, or a file
  #   named as a replace names its own (ExeReplacement's three suffixes), or a .old or a
  #   .new, is left beside it;
  # - crash.log does not gain the line saying the newer version did not say it had
  #   started within 60 seconds, or that it ended with exit code 7 before it did; or
  #   gains a line saying Windows would not end the newer version or it had not ended;
  # - the run that waited out the minute took less than 60 s, or the one whose newer
  #   file ended at once took 60 s or more;
  # - the run's exit code is not that of a second run of the file now at the path, with
  #   /s /noupdate, or a process is still running from the run's folder as the run
  #   ends, or holds the run's output open 10 s after it;
  # - a stand-in was not started with /s, /noupdate, one /replacecopy: naming the copy at
  #   the path, one /afterprocess: naming the old copy's process, and one /startedevent:
  #   and one /cancelevent:, each carrying an event's id. It writes the arguments it was
  #   started with to the file the job names, so the old copy's start of a newer version
  #   is read in the built exe.
  #
  # No exe the job runs makes a request of the network: the old copy's check is answered
  # by the Debug switch, and the 9.9.9 build is started with /noupdate.
  start-check:
    name: The start check (Windows)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish the old copy, the 9.9.9 command line and the stand-in
        shell: pwsh
        run: |
          # The old copy is this commit's command line, built on net48 with its Debug
          # switches, which answer its update check without a request to the network.
          # .NET Framework has no single-file publish and a Debug build is not merged
          # (the merge is Release only), so the old copy is a plain build: the exe with
          # its assemblies beside it, which is the copy the update replaces at its path.
          # Framework seat 34's job 12 builds this from the v3.5.0 tag instead; here it
          # is the current source, so the start handshake and its timing run every push.
          dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Debug -p:RestoreLockedMode=true --nologo -o publish/old
          if ($LASTEXITCODE -ne 0) { throw "The old copy did not build." }
          # The newer version is the merged 9.9.9 command line, one file as it ships.
          dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -p:RestoreLockedMode=true -p:OneFile=true -p:OneFileDir=publish/newer -p:Version=9.9.9 --nologo
          if ($LASTEXITCODE -ne 0) { throw "The 9.9.9 command line did not merge." }

          $standIn = Join-Path $env:RUNNER_TEMP 'stand-in'
          New-Item -ItemType Directory -Force -Path $standIn | Out-Null
          Set-Content -Path (Join-Path $standIn 'StandIn.csproj') -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <AssemblyName>installerclean-cli</AssemblyName>
              <Version>9.9.9</Version>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $standIn 'Program.cs') -Value @'
          var mode = System.Environment.GetEnvironmentVariable("START_CHECK_STAND_IN");
          var record = System.Environment.GetEnvironmentVariable("START_CHECK_STAND_IN_ARGUMENTS");
          if (!string.IsNullOrEmpty(record)) System.IO.File.WriteAllLines(record, args);
          if (mode == "sleep") System.Threading.Thread.Sleep(System.TimeSpan.FromSeconds(300));
          return mode == "exit" ? 7 : 3;
          '@
          dotnet publish (Join-Path $standIn 'StandIn.csproj') -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --nologo -o (Join-Path $standIn 'out')
          if ($LASTEXITCODE -ne 0) { throw "The stand-in did not publish." }
          if (-not (Test-Path (Join-Path $standIn 'out\installerclean-cli.exe'))) { throw "The stand-in's publish wrote no installerclean-cli.exe." }

      - name: Update the old copy to each newer file
        shell: pwsh
        run: |
          # For Get-StagingPrefix, Get-ReplaceSuffixes and Wait-StagingProcesses. Its Fail and
          # its failures are replaced below.
          . scripts/native-libraries.ps1
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }

          $resx = [xml](Get-Content -Raw src/InstallerClean.Core/Resources/Strings.resx)
          function Line([string]$name) {
            $value = ($resx.root.data | Where-Object name -eq $name).value
            if (-not $value) { throw "Strings.resx has no $name." }
            $value
          }

          # MAJOR.MINOR.BUILD of a file's version resource, as the old copy reads it.
          function Version3([string]$file) {
            $v = (Get-Item -LiteralPath $file).VersionInfo.FileVersion -as [version]
            if (-not $v) { return '' }
            "$($v.Major).$($v.Minor).$([Math]::Max($v.Build, 0))"
          }

          $oldExe = (Resolve-Path 'publish/old/installerclean-cli.exe').Path
          $old = Version3 $oldExe
          $latest = '9.9.9'
          $signals = (Resolve-Path 'publish/newer/installerclean-cli.exe').Path
          $standIn = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'stand-in\out\installerclean-cli.exe')).Path
          "  the old copy carries $old"
          foreach ($file in $signals, $standIn) {
            $carried = Version3 $file
            if ($carried -ne $latest) { throw "$file carries '$carried', not $latest." }
            "  $file carries $carried"
          }
          if ($old -eq $latest -or -not $old) { throw "The old copy carries '$old'." }

          $crashLog = Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'
          "  crash.log is read at $crashLog"
          function CrashLogLength { if (Test-Path -LiteralPath $crashLog) { (Get-Item -LiteralPath $crashLog).Length } else { 0 } }
          function CrashLogSince([long]$length) {
            if (-not (Test-Path -LiteralPath $crashLog)) { return '' }
            $bytes = [System.IO.File]::ReadAllBytes($crashLog)
            if ($bytes.Length -lt $length) { $length = 0 }
            [System.Text.Encoding]::UTF8.GetString($bytes, [int]$length, $bytes.Length - [int]$length)
          }

          # Runs exe with its input closed and its output read to the end, bounded at
          # $seconds, after which the process and everything it started are ended.
          function Run([string]$exe, [string[]]$arguments, [hashtable]$environment, [int]$seconds) {
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $info.ArgumentList.Add($a) }
            $info.UseShellExecute = $false
            $info.WorkingDirectory = Split-Path $exe
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($name in $environment.Keys) { $info.Environment[$name] = $environment[$name] }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $runStarted = Get-Date
            $p = [System.Diagnostics.Process]::Start($info)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $ended = $p.WaitForExit($seconds * 1000)
            if (-not $ended) { $p.Kill($true) }
            $p.WaitForExit()
            $clock.Stop()
            # The run's process, and everything it started, is ended where it passes the bound,
            # through its own handle. Nothing else is ended: a process left running from the
            # run's folder is named, and fails the run. One whose path cannot be read may be
            # running from there, or ending, with no path left to read, as the replace does
            # once the old copy has ended; it is named where it is still running 5 s on. A
            # process holding the output keeps the read below from completing, so the output
            # is read for 10 s and taken as it is.
            $left = @(Leftovers (Split-Path $exe) $runStarted)
            function Running($process) { try { -not $process.HasExited } catch { $true } }
            $clock5 = [System.Diagnostics.Stopwatch]::StartNew()
            while (@($left | Where-Object { -not $_.Path -and (Running $_) }).Count -and $clock5.Elapsed.TotalSeconds -lt 5) { Start-Sleep -Milliseconds 250 }
            $left = @($left | Where-Object { $_.Path -or (Running $_) })
            $whole = $out.Wait(10000) -and $err.Wait(10000)
            [pscustomobject]@{
              ExitCode = if ($ended) { $p.ExitCode } else { $null }
              Output = $(if ($out.IsCompleted) { $out.Result } else { '' }) + $(if ($err.IsCompleted) { $err.Result } else { '' })
              Seconds = $clock.Elapsed.TotalSeconds
              Id = $p.Id
              Whole = $whole
              Left = @($left | ForEach-Object { "$($_.Id) $(if ($_.Path) { $_.Path } else { '(path not readable)' })" })
            }
          }

          # Every installerclean-cli process started since $since whose path starts with
          # $folder, and every one whose path or start time cannot be read, since such a
          # process could be running from there. A second's margin is taken off $since, since
          # a process's start time is read off a coarser clock than Get-Date's.
          function Leftovers([string]$folder, [datetime]$since) {
            @(Get-Process -Name 'installerclean-cli' -ErrorAction SilentlyContinue | Where-Object {
              $started = try { $_.StartTime } catch { $null }
              ($null -eq $started -or $started -ge $since.AddSeconds(-1)) -and (-not $_.Path -or $_.Path.StartsWith($folder, 'OrdinalIgnoreCase')) })
          }

          # The names that must not be left beside the exe: those a replace gives its files,
          # and .old and .new.
          $leftNames = @(Get-ReplaceSuffixes) + '.old', '.new'
          "  nothing may be left beside the exe named with $($leftNames -join ', ')"

          # The InstallerClean entries with $id written since $since. Only the answer that no
          # entry matches reads as none; any other failure to read the log stops the step.
          # An entry's text is the first of its insertion strings, which does not depend on
          # the message file the source is registered with.
          function Read-Entries([datetime]$since, [int]$id) {
            try {
              @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean'; Id = $id; StartTime = $since } -ErrorAction Stop |
                ForEach-Object { [pscustomobject]@{ Text = $(if ($_.Properties.Count) { [string]$_.Properties[0].Value } else { $_.Message }) } })
            }
            catch {
              if ($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*' -or $_.Exception.Message -like '*No events were found*' -or
                  $_.Exception.Message -like '*no providers*InstallerClean*' -or $_.FullyQualifiedErrorId -like 'NoMatchingProvidersFound*') { return , @() }
              throw "The Application log could not be read: $($_.Exception.Message)"
            }
          }

          # The entries with $id the InstallerClean source wrote since $since whose text
          # is like $like, read again every 250 ms for up to 5 s until one is there.
          function Entries([datetime]$since, [int]$id, [string]$like) {
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            do {
              $found = @(Read-Entries $since $id | Where-Object { $_.Text -like $like })
              if ($found.Count) { return , $found }
              Start-Sleep -Milliseconds 250
            } while ($clock.Elapsed.TotalSeconds -lt 5)
            , @()
          }

          # The update.json scripts/write-update-manifest.mjs writes for the given downloads.
          function Manifest-For([string[]]$kinds) {
            $written = Join-Path $env:RUNNER_TEMP "start-check-written-$($kinds -join '-').json"
            node scripts/write-update-manifest.mjs $written $kinds | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "The writer did not write $written." }
            Get-Content -LiteralPath $written -Raw -Encoding utf8
          }
          $allowsCli = Manifest-For 'setup', 'portable', 'slim', 'cli'

          function Update([string]$label, [string]$newerFile, [string]$standInMode, [string]$manifest = $allowsCli) {
            Write-Host "== $label"
            $folder = Join-Path $env:RUNNER_TEMP "start-check-$label"
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            $manifestFile = Join-Path $env:RUNNER_TEMP "start-check-$label-update.json"
            Set-Content -LiteralPath $manifestFile -Value $manifest -Encoding utf8NoBOM -NoNewline
            Copy-Item -LiteralPath $oldExe -Destination $folder
            $exe = Join-Path $folder 'installerclean-cli.exe'
            foreach ($left in $leftNames) { if (Test-Path -LiteralPath "$exe$left") { throw "$exe$left is there before the run." } }
            $logLength = CrashLogLength
            $since = Get-Date
            $argumentsFile = Join-Path $env:RUNNER_TEMP "start-check-$label-arguments.txt"
            Remove-Item -LiteralPath $argumentsFile -ErrorAction SilentlyContinue
            $run = Run $exe @('/s') @{
              INSTALLERCLEAN_DEBUG_PRETEND_LATEST = "v$latest"
              INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD = $newerFile
              INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST = $manifestFile
              START_CHECK_STAND_IN = $standInMode
              START_CHECK_STAND_IN_ARGUMENTS = $argumentsFile
            } 240
            # Everything below is printed with Write-Host, since what the function writes
            # to its output is what it answers with.
            Write-Host "::group::$label, the run's output"
            Write-Host $run.Output
            Write-Host "::endgroup::"
            Write-Host "  exit code $($run.ExitCode), after $([math]::Round($run.Seconds, 1)) s"
            if (-not $run.Whole) { Fail "$label`: a process held the run's output open 10 s after the run ended, so the output above is not the whole of it." }
            if ($null -eq $run.ExitCode) { Fail "$label`: the run was still going after 240 s and was ended." }
            if ($run.Left) { Fail "$label`: a process was still running from $folder when the run ended: $($run.Left -join ', ')" }
            # The replace writes to crash.log too, so crash.log is read once it has ended.
            $replaces = Wait-StagingProcesses 120 $since
            if ($replaces) { Fail "$label`: a process was still running from a staging folder 120 s after the run ended: $($replaces -join ', ')" }
            else { Write-Host "  nothing is running from a staging folder" }
            $logged = CrashLogSince $logLength
            if ($logged) { Write-Host "  crash.log gained:"; $logged -split "`r?`n" | Where-Object { $_ } | ForEach-Object { Write-Host "    $_" } }
            else { Write-Host "  crash.log gained nothing" }
            [pscustomobject]@{ Label = $label; Exe = $exe; Run = $run; Since = $since; Logged = $logged; Arguments = $argumentsFile }
          }

          function Expect-Printed($update, [string[]]$printed, [string[]]$notPrinted) {
            foreach ($line in $printed) {
              if ($update.Run.Output.Contains($line)) { "  printed: $line" } else { Fail "$($update.Label): it did not print: $line" }
            }
            foreach ($line in $notPrinted) {
              if ($update.Run.Output.Contains($line)) { Fail "$($update.Label): it printed: $line" } else { "  did not print: $line" }
            }
          }

          function Expect-Entries($update, [int]$id, [string]$like, [int]$otherId) {
            $found = Entries $update.Since $id $like
            if ($found.Count -eq 1) { "  the Application log holds one $id`: $($found[0].Text)" }
            else {
              $note = $update.Run.Output.Contains((Line 'Cli.EventLogUnavailable'))
              $why = @($update.Logged -split "`r?`n" | Where-Object { $_ -like '*An entry was not written to the Application log*' })
              Fail ("$($update.Label): $($found.Count) entries with Event ID $id like '$like', where one was expected. " +
                "The run $(if ($note) { 'printed' } else { 'did not print' }) the note that the Application log refused an entry" +
                $(if ($why) { "; crash.log: $($why -join ' | ')" } else { '; crash.log names no refused entry' }) + '.')
            }
            foreach ($absent in $otherId, (Get-NothingAtPathEventId)) {
              $other = @(Read-Entries $update.Since $absent)
              if ($other) { Fail "$($update.Label): the Application log holds $($other.Count) entries with Event ID $absent since the run started: $(($other | ForEach-Object Text) -join ' | ')" }
              else { "  no $absent since the run started" }
            }
          }

          function Expect-File($update, [string]$version) {
            $carried = Version3 $update.Exe
            if ($carried -eq $version) { "  the file at the path carries $carried" } else { Fail "$($update.Label): the file at the path carries '$carried', not $version." }
            foreach ($suffix in $leftNames) {
              if (Test-Path -LiteralPath "$($update.Exe)$suffix") { Fail "$($update.Label): $($update.Exe)$suffix is left." } else { "  no $suffix" }
            }
          }

          function Expect-Logged($update, [string[]]$logged, [string[]]$notLogged) {
            foreach ($line in $logged) {
              if ($update.Logged.Contains($line)) { "  crash.log: $line" } else { Fail "$($update.Label): crash.log did not gain: $line" }
            }
            foreach ($line in $notLogged) {
              if ($update.Logged.Contains($line)) { Fail "$($update.Label): crash.log gained: $line" } else { "  crash.log did not gain: $line" }
            }
          }

          # What the old copy started the stand-in with: the command it was given, the copy it
          # stands for and that copy's process, the two events and /noupdate, each once.
          function Expect-Arguments($update) {
            if (-not (Test-Path -LiteralPath $update.Arguments)) { Fail "$($update.Label): the stand-in wrote no arguments, so it was not started."; return }
            $given = @(Get-Content -LiteralPath $update.Arguments)
            "  the stand-in was started with: $($given -join ' ')"
            foreach ($want in '/s', '/noupdate', "/replacecopy:$($update.Exe)", "/afterprocess:$($update.Run.Id)") {
              $count = @($given | Where-Object { $_ -ceq $want }).Count
              if ($count -eq 1) { "  it was given $want" } else { Fail "$($update.Label): the stand-in was given $want $count times, not once." }
            }
            foreach ($prefix in '/cancelevent:', '/startedevent:') {
              $count = @($given | Where-Object { $_ -cmatch ('^' + [regex]::Escape($prefix) + '[0-9a-f]{32}$') }).Count
              if ($count -eq 1) { "  it was given one $prefix with an event's id" } else { Fail "$($update.Label): the stand-in was given $count $prefix arguments carrying an event's id, not one." }
            }
          }

          function Expect-ExitCode($update) {
            if ($null -eq $update.Run.ExitCode) { "  the exit code is not compared, since the run was ended"; return }
            $again = Run $update.Exe @('/s', '/noupdate') @{} 240
            "  a second run of the file at the path, with /s /noupdate, exited with $($again.ExitCode)"
            if ($update.Run.ExitCode -ne $again.ExitCode) { Fail "$($update.Label): the run exited with $($update.Run.ExitCode), the file at the path with $($again.ExitCode)." }
          }

          $available = (Line 'UpdateNotice.Available') -f $latest
          $downloading = (Line 'UpdateNotice.Downloading') -f $latest
          $runningNewer = (Line 'Cli.UpdateRunningNewer') -f '/s', $latest
          $notRun = Line 'Cli.UpdateNotRun'
          $runningInstead = (Line 'Cli.UpdateRunningInstead') -f '/s', $old
          $endRefused = 'Windows refused the request to end the newer version'
          $notEnded = 'The newer version had not ended a few seconds after'
          $updatedLike = '*' + ((Line 'Cli.EventLogUpdated') -f '/s', $old, $latest, '/s') + '*'

          # Each crash.log line the checks look for, present or absent, is text the code
          # under src/ still writes, so an absence cannot pass on a line nothing writes.
          $source = (Get-ChildItem -Path src -Recurse -Filter *.cs | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and $_.FullName -notmatch 'InstallerClean\.Tests' } |
                     ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName }) -join "`n"
          foreach ($line in 'The newer version ended with exit code ', ' before it said it had started.',
                            'The newer version did not say it had started within ', $endRefused, $notEnded) {
            if (-not $source.Contains($line)) { throw "No C# file under src/ holds '$line', so the crash.log check on it would read nothing." }
          }
          $failedLike = '*' + ((Line 'Cli.EventLogUpdateNotRun') -f '/s', $old, $latest) + '*'

          $update = Update 'signals' $signals ''
          Expect-Printed $update @($available, $downloading, $runningNewer) @($notRun, $runningInstead)
          Expect-Entries $update 3005 $updatedLike 3006
          Expect-File $update $latest
          Expect-Logged $update @() @('did not say it had started', 'before it said it had started')
          Expect-ExitCode $update

          $update = Update 'exits' $standIn 'exit'
          Expect-Printed $update @($available, $downloading, $notRun, $runningInstead) @($runningNewer)
          Expect-Entries $update 3006 $failedLike 3005
          Expect-File $update $old
          Expect-Logged $update @('The newer version ended with exit code 7 before it said it had started.') @($endRefused, $notEnded)
          Expect-Arguments $update
          if ($update.Run.Seconds -ge 60) { Fail "exits: the run took $([math]::Round($update.Run.Seconds, 1)) s, though the newer file ended at once." }
          Expect-ExitCode $update

          $update = Update 'sleeps' $standIn 'sleep'
          Expect-Printed $update @($available, $downloading, $notRun, $runningInstead) @($runningNewer)
          Expect-Entries $update 3006 $failedLike 3005
          Expect-File $update $old
          Expect-Logged $update @('The newer version did not say it had started within 60 seconds.') @($endRefused, $notEnded)
          Expect-Arguments $update
          if ($update.Run.Seconds -lt 60) { Fail "sleeps: the run took $([math]::Round($update.Run.Seconds, 1)) s, less than the minute it waits." }
          Expect-ExitCode $update

          $cannotInstall = (Line 'UpdateNotice.CannotInstallAutomatically') -f $latest
          $releasePage = (Line 'Cli.UpdateDownloadLink') -f (Line 'UpdateNotice.Download'), "https://github.com/no-faff/InstallerClean/releases/tag/v$latest"
          $refusedLike = '*' + ((Line 'Cli.EventLogUpdateCannotInstall') -f '/s', $old, $latest) + '*'
          $refusals = [ordered]@{
            'refused by its schema'      = '{"schema": 2, "downloads": {"cli": {"requires": []}}}'
            'refused by its requirement' = '{"schema": 1, "downloads": {"cli": {"requires": ["dotnet-desktop-99"]}}}'
            'refused by its absence'     = (Manifest-For 'setup', 'portable', 'slim')
          }
          foreach ($label in $refusals.Keys) {
            $update = Update $label $signals '' $refusals[$label]
            Expect-Printed $update @($available, $cannotInstall, $releasePage) @($downloading, $runningNewer, $notRun, $runningInstead)
            Expect-Entries $update 3006 $refusedLike 3005
            Expect-File $update $old
            if ($update.Logged) { Fail "$label`: crash.log gained text." } else { "  crash.log gained nothing" }
            Expect-ExitCode $update
          }

          if ($failures.Count) {
            "$($failures.Count) checks failed:"
            $failures | ForEach-Object { "  $_" }
            exit 1
          }
          'Every check passed.'
